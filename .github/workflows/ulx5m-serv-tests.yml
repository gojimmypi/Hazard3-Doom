name: ULX5M-GS SERV bootloader tests

on:
  push:
    paths:
      - 'bootloader-serv/**'
      - 'scripts/test-ulx5m-serv.sh'
      - 'scripts/test-ulx5m-serv-hardware.ps1'
      - '.github/workflows/ulx5m-serv-tests.yml'
  pull_request:
    paths:
      - 'bootloader-serv/**'
      - 'scripts/test-ulx5m-serv.sh'
      - 'scripts/test-ulx5m-serv-hardware.ps1'
      - '.github/workflows/ulx5m-serv-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ulx5m-serv-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline simulation, firmware and synthesis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OSS_CAD_SUITE_VERSION: '2026-10-14'
      XPACK_RISCV_GCC_VERSION: '15.2.0-1'
      XPACK_RISCV_GCC_LINUX_SHA256: 'aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
          python-override: true

      - name: Check tools and script syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          gcc --version
          yosys --version
          nextpnr-himbaechel --version
          iverilog -V
          bash -n scripts/test-ulx5m-serv.sh
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck scripts/test-ulx5m-serv.sh

      - name: Install pinned RISC-V compiler
        shell: bash
        run: |
          set -euo pipefail
          install_root="${GITHUB_WORKSPACE}/bin/riscv-gcc"
          archive_name="xpack-riscv-none-elf-gcc-${XPACK_RISCV_GCC_VERSION}-linux-x64.tar.gz"
          archive="${RUNNER_TEMP}/${archive_name}"
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_RISCV_GCC_VERSION}/${archive_name}"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          printf '%s  %s\n' "${XPACK_RISCV_GCC_LINUX_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${install_root}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_root}"
          "${install_root}/bin/riscv-none-elf-gcc" --version
          printf '%s\n' "${install_root}/bin" >> "${GITHUB_PATH}"

      - name: Run all hardware-free SERV tests and synthesis
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p bootloader-serv/build-ulx5m-gs
          set +e
          bash scripts/test-ulx5m-serv.sh --offline --synth 2>&1 |
            tee bootloader-serv/build-ulx5m-gs/serv-tests.log
          status=${PIPESTATUS[0]}
          {
            echo '## ULX5M-GS SERV offline tests'
            echo
            echo 'Hardware-free checks, Icarus simulations, firmware build, and GateMate synthesis.'
            echo 'No FPGA programming or flash operations.'
            echo
            tail -n 1 bootloader-serv/build-ulx5m-gs/serv-tests.log || true
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Upload test logs and synthesized netlist
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ulx5m-serv-tests-${{ github.run_id }}
          path: |
            bootloader-serv/build-ulx5m-gs/serv-tests.log
            bootloader-serv/build-ulx5m-gs/*.vvp
            bootloader-serv/build-ulx5m-gs/*waveform.csv
            bootloader-serv/build-ulx5m-gs/top_ulx5m_gs_flash_read-serv.json
            bootloader-serv/build-ulx5m-gs/serv/fw_ulx5m_flash_read.elf
          if-no-files-found: warn
          retention-days: 14
