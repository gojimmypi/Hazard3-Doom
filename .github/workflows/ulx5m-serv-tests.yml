
name: ULX5M-GS SERV bootloader offline checks

on:
  push:
    branches: [develop-cleanup]
    paths:
      - 'bootloader-serv/**'
      - '.github/scripts/ulx5m_bootloader_sweep.py'
      - '.github/scripts/test_ulx5m_bootloader_sweep.py'
      - '.github/workflows/ulx5m-serv-tests.yml'
      - '.github/workflows/ulx5m-bootloader-seed-sweep.yml'
  pull_request:
    branches: [develop-cleanup, develop]
    paths:
      - 'bootloader-serv/**'
      - '.github/scripts/ulx5m_bootloader_sweep.py'
      - '.github/scripts/test_ulx5m_bootloader_sweep.py'
      - '.github/workflows/ulx5m-serv-tests.yml'
      - '.github/workflows/ulx5m-bootloader-seed-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ulx5m-serv-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OSS_CAD_SUITE_VERSION: '2026-07-20'
      XPACK_VERSION: '12.2.0-1'
      XPACK_SHA256: '04b5f45d609b221505e9232b1b63ae6cdb17d0a23f13ce9c231fc4008753a58a'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
          python-override: true

      - name: Install checksum-verified RISC-V compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="xpack-riscv-none-elf-gcc-${XPACK_VERSION}-linux-x64.tar.gz"
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_VERSION}/${archive}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "$url"
          printf '%s  %s\n' "$XPACK_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir -p bin/riscv-gcc
          tar -xzf "${RUNNER_TEMP}/${archive}" --strip-components=1 -C bin/riscv-gcc
          printf '%s\n' "${GITHUB_WORKSPACE}/bin/riscv-gcc/bin" >> "$GITHUB_PATH"

      - name: Test sweep safety, native flash protection and RTL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_ulx5m_bootloader_sweep.py' -v
          make -C bootloader-serv -f Makefile.ulx5m-gs test

      - name: Synthesize canonical bootloader without routing
        shell: bash
        run: |
          set -euo pipefail
          make -C bootloader-serv -f Makefile.ulx5m-gs synth-check
          test -s bootloader-serv/build-ulx5m-gs/bootloader/top_ulx5m_gs_bootloader.json
          echo 'Offline tests and offline synthesis smoke check passed (routing and boot NOT verified).' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload synthesis log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulx5m-offline-synth-${{ github.run_id }}
          path: bootloader-serv/build-ulx5m-gs/bootloader/synth.log
          if-no-files-found: warn
          retention-days: 14
