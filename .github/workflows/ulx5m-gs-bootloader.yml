# PicoRV32 USB enumeration probe build and test for the ULX5M-GS board.
name: ULX5M-GS PicoRV32 USB probe (manual)

# Retain this legacy probe for comparison while focusing CI on SERV.
# Run manually when investigating the PicoRV32 implementation.

on:
# workflow
#  push:
#    paths:
#      - 'bootloader/**'
#      - '.github/workflows/ulx5m-gs-bootloader.yml'
#  pull_request:
#    paths:
#      - 'bootloader/**'
#      - '.github/workflows/ulx5m-gs-bootloader.yml'

  workflow_dispatch:
    inputs:
      oss_cad_suite_version:
        description: 'OSS CAD Suite release (YYYY-MM-DD)'
        type: string
        required: true
        default: '2026-07-20'
      seed:
        description: 'Optional nextpnr placement seed (blank uses the default)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ulx5m-bootloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-probe:
    name: ULX5M-GS USB enumeration probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: bootloader
    env:
      OSS_CAD_SUITE_VERSION: ${{ inputs.oss_cad_suite_version || '2026-07-20' }}
      PNR_SEED: ${{ inputs.seed || '' }}
      XPACK_RISCV_GCC_VERSION: '15.2.0-1'
      XPACK_RISCV_GCC_LINUX_SHA256: 'aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
          python-override: true

      - name: Check tools
        run: |
          yosys --version
          nextpnr-himbaechel --version
          command -v gmpack
          iverilog -V
          vvp -V
          python3 --version

      - name: Static checks
        run: |
          python3 tests/check-ulx5m-gs-port.py
          python3 tests/check-ulx5m-gs-usb.py
          python3 tests/check-ulx5m-gs-probe.py

      - name: Test registered memory response
        run: |
          mkdir -p build-ulx5m-gs
          iverilog -g2012 -s tb_soc_mem_response_reg \
            -o build-ulx5m-gs/response-test.vvp \
            rtl/soc_mem_response_reg.v tests/tb_soc_mem_response_reg.v
          vvp build-ulx5m-gs/response-test.vvp

      - name: Test PicoRV32 BRAM and Wishbone bus
        run: make -f Makefile.ulx5m-gs test-usb-probe-bus

      - name: Install pinned RISC-V compiler
        run: |
          install_root="${GITHUB_WORKSPACE}/bin/riscv-gcc"
          archive_name="xpack-riscv-none-elf-gcc-${XPACK_RISCV_GCC_VERSION}-linux-x64.tar.gz"
          archive="${RUNNER_TEMP}/${archive_name}"
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_RISCV_GCC_VERSION}/${archive_name}"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          printf '%s  %s\n' "${XPACK_RISCV_GCC_LINUX_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${install_root}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_root}"
          "${install_root}/bin/riscv-none-elf-gcc" --version
          printf '%s\n' "${install_root}/bin" >> "${GITHUB_PATH}"

      - name: Build USB enumeration probe (48 MHz timing required)
        run: |
          if [[ -n "${PNR_SEED}" && ! "${PNR_SEED}" =~ ^[1-9][0-9]*$ ]]; then
            echo 'ERROR: Seed must be a positive decimal integer or blank.' >&2
            exit 2
          fi
          mkdir -p build-ulx5m-gs
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'oss_cad_suite_version=%s\n' "${OSS_CAD_SUITE_VERSION}"
            printf 'pnr_seed=%s\n' "${PNR_SEED:-default}"
            yosys --version
            nextpnr-himbaechel --version
          } > build-ulx5m-gs/usb-probe-build-info.txt
          cat build-ulx5m-gs/usb-probe-build-info.txt

          if [[ -n "${PNR_SEED}" ]]; then
            # The Makefile allows NEXTPNR to be overridden; append a seed
            # without modifying the normal local build or its defaults.
            make -f Makefile.ulx5m-gs usb-probe \
              NEXTPNR="nextpnr-himbaechel --seed ${PNR_SEED}"
          else
            make -f Makefile.ulx5m-gs usb-probe
          fi
          test -s build-ulx5m-gs/top_ulx5m_gs_usb_probe.bit
          test -s build-ulx5m-gs/usb-probe-synth.log
          test -s build-ulx5m-gs/usb-probe-pnr.log
          timing_line="$(grep "Max frequency for clock 'bram_i.clk'" build-ulx5m-gs/usb-probe-pnr.log | tail -n 1)"
          printf '%s\n' "${timing_line}"
          case "${timing_line}" in
            *'(PASS at 48.00 MHz)'*) ;;
            *) echo 'ERROR: Missing post-route 48 MHz timing pass.' >&2; exit 1 ;;
          esac

      - name: Upload probe artifacts and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ulx5m-gs-usb-probe-${{ github.sha }}
          path: |
            bootloader/build-ulx5m-gs/top_ulx5m_gs_usb_probe.bit
            bootloader/build-ulx5m-gs/fw_ulx5m_probe.elf
            bootloader/build-ulx5m-gs/fw_ulx5m_probe.hex
            bootloader/build-ulx5m-gs/usb-probe-synth.log
            bootloader/build-ulx5m-gs/usb-probe-pnr.log
            bootloader/build-ulx5m-gs/usb-probe-build-info.txt
          if-no-files-found: warn
          retention-days: 14
