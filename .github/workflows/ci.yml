name: Software CI

on:
  push:
    branches: [ '*' ]

  pull_request:
    branches: [ '*' ]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TOOLCHAIN_PREFIX: riscv-none-elf-

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QUALITY_LOG_DIR: ${{ runner.temp }}/quality-checks

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install script checks
        id: install_script_checks
        continue-on-error: true
        run: |
          mkdir -p "${QUALITY_LOG_DIR}"
          set +e
          {
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends shellcheck
          } 2>&1 | tee "${QUALITY_LOG_DIR}/install-script-checks.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      # These checks are independent. Record each result instead of stopping
      # at the first failure, then fail the job once all checks have run.
      - name: Check shell scripts
        id: shellcheck
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${QUALITY_LOG_DIR}"
          log="${QUALITY_LOG_DIR}/shellcheck.log"
          mapfile -d '' scripts < <(
              git ls-files -z -- 'scripts/*.sh' 'doom/*.sh' '.github/scripts/*.sh'
          )
          if (( ${#scripts[@]} == 0 )); then
              echo "No shell scripts found." | tee "${log}"
              echo "::error::No shell scripts found."
              exit 1
          fi

          set +e
          shellcheck -x "${scripts[@]}" 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      - name: Check executable permissions
        id: executable_permissions
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${QUALITY_LOG_DIR}"
          log="${QUALITY_LOG_DIR}/executable-permissions.log"
          : > "${log}"
          status=0

          while IFS= read -r -d '' script; do
              mode="$(git ls-files --stage -- "${script}" | awk '{print $1}')"
              if [[ "${mode}" != "100755" ]]; then
                  {
                      printf 'Missing Git executable bit: %s\n' "${script}"
                      printf 'Current Git mode: %s\n' "${mode:-untracked}"
                      printf 'Fix: git update-index --chmod=+x "%s"\n' "${script}"
                      printf 'Verify: git ls-files --stage -- "%s"\n\n' "${script}"
                  } | tee -a "${log}"
                  echo "::error file=${script},title=Missing executable bit::Fix: git update-index --chmod=+x ${script}"
                  status=1
              fi
          done < <(git ls-files -z -- 'scripts/*.sh' 'doom/*.sh')

          if (( status == 0 )); then
              echo "All tracked scripts/*.sh and doom/*.sh files have Git mode 100755." > "${log}"
          fi

          exit "${status}"

      - name: Check Python syntax
        id: python_syntax
        continue-on-error: true
        run: |
          mkdir -p "${QUALITY_LOG_DIR}"
          set +e
          python -m compileall -q doom tests 2>&1 | tee "${QUALITY_LOG_DIR}/python-syntax.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      - name: Run host-tool tests
        id: host_tool_tests
        continue-on-error: true
        run: |
          mkdir -p "${QUALITY_LOG_DIR}"
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee "${QUALITY_LOG_DIR}/host-tool-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      - name: Report quality check failures
        if: always()
        shell: bash
        env:
          INSTALL_SCRIPT_CHECKS_OUTCOME: ${{ steps.install_script_checks.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
          EXECUTABLE_PERMISSIONS_OUTCOME: ${{ steps.executable_permissions.outcome }}
          PYTHON_SYNTAX_OUTCOME: ${{ steps.python_syntax.outcome }}
          HOST_TOOL_TESTS_OUTCOME: ${{ steps.host_tool_tests.outcome }}
        run: bash .github/scripts/report-quality-checks.sh

  visual-studio-windows:
    name: Visual Studio native Windows validation
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # VisualGDB is intentionally not installed on hosted CI runners. Validate
      # the native project/settings contract, then ask the installed Microsoft
      # build system to load and evaluate both project configurations.
      - name: Validate native Windows Visual Studio project metadata
        id: native_metadata
        continue-on-error: true
        shell: pwsh
        run: .\.github\scripts\check-windows-visualgdb.ps1

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
              throw "vswhere.exe was not found at $vswhere"
          }

          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
              -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
              throw "MSBuild.exe was not found in the installed Visual Studio instance."
          }

          Write-Host "Using MSBuild: $msbuild"
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Evaluate native Windows project with MSBuild
        shell: pwsh
        run: |
          # The repository project targets a newer Visual Studio toolset than
          # windows-2022 provides. /pp only loads/evaluates the project; use the
          # runner's v143 toolset for that evaluation. The metadata validator
          # above independently verifies the toolset declared by the project.
          $status = 0
          foreach ($configuration in @("Debug", "Release")) {
              $output = Join-Path $env:RUNNER_TEMP "Hazard3-Doom-$configuration.preprocessed.xml"

              & $env:MSBUILD_EXE `
                  "VisualGDB\Hazard3-Doom.vcxproj" `
                  /nologo `
                  "/pp:$output" `
                  "/p:Configuration=$configuration" `
                  /p:Platform=Win32 `
                  /p:PlatformToolset=v143

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::MSBuild failed to evaluate the native $configuration project configuration."
                  $status = 1
                  continue
              }
              if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
                  Write-Host "::error::MSBuild did not create the preprocessed $configuration project."
                  $status = 1
                  continue
              }
              if ((Get-Item -LiteralPath $output).Length -eq 0) {
                  Write-Host "::error::MSBuild created an empty preprocessed $configuration project."
                  $status = 1
              }
          }

          exit $status

      - name: Report native Windows validation failures
        if: always()
        shell: pwsh
        env:
          NATIVE_METADATA_OUTCOME: ${{ steps.native_metadata.outcome }}
        run: |
          if ($env:NATIVE_METADATA_OUTCOME -ne 'success') {
              Write-Host "::error::Native Windows Visual Studio metadata validation failed."
              exit 1
          }

  visual-studio-wsl:
    name: Visual Studio WSL build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      TOOLCHAIN_PREFIX: riscv64-unknown-elf-
      WSLENV: TOOLCHAIN_PREFIX
      WSL_DISTRO: Hazard3-CI
      WSL_ROOTFS_URL: https://cloud-images.ubuntu.com/wsl/releases/24.04/20240423/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz
      WSL_ROOTFS_SHA256: 8251e27ffff381a4af5f41dcb94d867de3e0d9774a9241908ab34555d99315ea

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate WSL Visual Studio project metadata
        id: wsl_metadata
        continue-on-error: true
        shell: pwsh
        run: .\.github\scripts\check-wsl-visualgdb.ps1

      - name: Import Ubuntu under WSL1
        shell: pwsh
        run: |
          $rootfs = Join-Path $env:RUNNER_TEMP "ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz"
          $installDirectory = Join-Path $env:RUNNER_TEMP $env:WSL_DISTRO

          Write-Host "Downloading Canonical Ubuntu 24.04 WSL rootfs..."
          curl.exe --fail --location --retry 3 --output $rootfs $env:WSL_ROOTFS_URL
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download the Ubuntu WSL rootfs."
          }

          $actualHash = (Get-FileHash -LiteralPath $rootfs -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WSL_ROOTFS_SHA256) {
              throw "Ubuntu WSL rootfs SHA256 mismatch. Expected $env:WSL_ROOTFS_SHA256, got $actualHash."
          }

          New-Item -ItemType Directory -Force -Path $installDirectory | Out-Null

          # Avoid the Microsoft Store/catalog installation path on the hosted
          # Windows Server runner. Import Canonical's WSL rootfs directly and
          # request WSL1 explicitly.
          wsl.exe --import $env:WSL_DISTRO $installDirectory $rootfs --version 1
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to import $env:WSL_DISTRO under WSL1."
          }

          Remove-Item -LiteralPath $rootfs -Force

          wsl.exe --set-default $env:WSL_DISTRO
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to set $env:WSL_DISTRO as the default WSL distribution."
          }

          # Imported distributions default to root, which is exactly what this
          # ephemeral CI environment needs for package installation.
          wsl.exe -d $env:WSL_DISTRO -u root -- /bin/true
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to initialize $env:WSL_DISTRO."
          }

          wsl.exe --list --verbose
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to list WSL distributions."
          }

      - name: Install WSL build dependencies
        shell: pwsh
        run: |
          wsl.exe -d $env:WSL_DISTRO -u root -- bash -lc `
              "export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get install --yes --no-install-recommends binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf git make python3 ca-certificates"
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to install the WSL build dependencies."
          }

      - name: Show WSL and RISC-V toolchain versions
        shell: pwsh
        run: |
          $status = 0

          wsl.exe -d $env:WSL_DISTRO -- bash -lc 'uname -a'
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to run uname inside WSL."
              $status = 1
          }

          wsl.exe -d $env:WSL_DISTRO -- bash -lc 'printf "TOOLCHAIN_PREFIX=%s\n" "${TOOLCHAIN_PREFIX}"'
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::TOOLCHAIN_PREFIX was not available inside WSL."
              $status = 1
          }

          wsl.exe -d $env:WSL_DISTRO -- riscv64-unknown-elf-gcc --version
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::RISC-V GCC was not available inside WSL."
              $status = 1
          }

          wsl.exe -d $env:WSL_DISTRO -- bash -lc 'printf "int x;\n" | riscv64-unknown-elf-gcc -march=rv32imc_zicsr_zifencei_zba_zbb_zbs -mabi=ilp32 -x c -c -o /tmp/hazard3-isa-probe.o -'
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::WSL RISC-V GCC does not support the Hazard3 ISA flags."
              $status = 1
          }

          exit $status

      - name: Build through the Visual Studio WSL bridge
        id: wsl_bridge_build
        continue-on-error: true
        shell: cmd
        run: call VisualGDB\build-wsl.cmd build

      - name: Verify WSL build output
        id: wsl_bridge_build_verify
        continue-on-error: true
        shell: pwsh
        run: |
          $elf = Join-Path $env:GITHUB_WORKSPACE "build\hazard3-boot-monitor.elf"
          if (-not (Test-Path -LiteralPath $elf -PathType Leaf)) {
              throw "WSL build did not create $elf"
          }
          if ((Get-Item -LiteralPath $elf).Length -eq 0) {
              throw "WSL build created an empty ELF: $elf"
          }
          Get-Item -LiteralPath $elf | Format-List FullName, Length, LastWriteTimeUtc

      - name: Clean through the Visual Studio WSL bridge
        id: wsl_bridge_clean
        continue-on-error: true
        shell: cmd
        run: call VisualGDB\build-wsl.cmd clean

      - name: Verify WSL clean output
        id: wsl_bridge_clean_verify
        continue-on-error: true
        shell: pwsh
        run: |
          $status = 0
          foreach ($path in @(
              "build\hazard3-boot-monitor.elf",
              "build\hazard3-boot-monitor.map"
          )) {
              if (Test-Path -LiteralPath $path) {
                  Write-Host "::error::WSL clean left generated output behind: $path"
                  $status = 1
              }
          }
          exit $status

      - name: Rebuild through the Visual Studio WSL bridge
        id: wsl_bridge_rebuild
        continue-on-error: true
        shell: cmd
        run: call VisualGDB\build-wsl.cmd rebuild

      - name: Verify WSL rebuild output
        id: wsl_bridge_rebuild_verify
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location $env:GITHUB_WORKSPACE
          try {
              wsl.exe -d $env:WSL_DISTRO -- bash -c `
                  'test -s build/hazard3-boot-monitor.elf && test -s build/hazard3-boot-monitor.map && riscv64-unknown-elf-readelf --file-header build/hazard3-boot-monitor.elf && riscv64-unknown-elf-size build/hazard3-boot-monitor.elf'
              if ($LASTEXITCODE -ne 0) {
                  throw "WSL rebuild output validation failed."
              }
          }
          finally {
              Pop-Location
          }

      - name: Report WSL validation failures
        if: always()
        shell: pwsh
        env:
          WSL_METADATA_OUTCOME: ${{ steps.wsl_metadata.outcome }}
          WSL_BRIDGE_BUILD_OUTCOME: ${{ steps.wsl_bridge_build.outcome }}
          WSL_BRIDGE_BUILD_VERIFY_OUTCOME: ${{ steps.wsl_bridge_build_verify.outcome }}
          WSL_BRIDGE_CLEAN_OUTCOME: ${{ steps.wsl_bridge_clean.outcome }}
          WSL_BRIDGE_CLEAN_VERIFY_OUTCOME: ${{ steps.wsl_bridge_clean_verify.outcome }}
          WSL_BRIDGE_REBUILD_OUTCOME: ${{ steps.wsl_bridge_rebuild.outcome }}
          WSL_BRIDGE_REBUILD_VERIFY_OUTCOME: ${{ steps.wsl_bridge_rebuild_verify.outcome }}
        run: |
          $status = 0
          $checks = @(
              @('WSL Visual Studio metadata validation', $env:WSL_METADATA_OUTCOME),
              @('WSL bridge build', $env:WSL_BRIDGE_BUILD_OUTCOME),
              @('WSL bridge build output validation', $env:WSL_BRIDGE_BUILD_VERIFY_OUTCOME),
              @('WSL bridge clean', $env:WSL_BRIDGE_CLEAN_OUTCOME),
              @('WSL bridge clean output validation', $env:WSL_BRIDGE_CLEAN_VERIFY_OUTCOME),
              @('WSL bridge rebuild', $env:WSL_BRIDGE_REBUILD_OUTCOME),
              @('WSL bridge rebuild output validation', $env:WSL_BRIDGE_REBUILD_VERIFY_OUTCOME)
          )

          foreach ($check in $checks) {
              if ($check[1] -ne 'success') {
                  Write-Host "::error::$($check[0]) failed (outcome: $($check[1]))."
                  $status = 1
              }
          }

          exit $status

  windows-cli-builds:
    name: Windows command-line build paths
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Git Bash: Provide python3"
        shell: pwsh
        run: |
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $pythonDirectory = Split-Path -Parent $python
          $python3 = Join-Path $pythonDirectory "python3.exe"

          if (-not (Test-Path -LiteralPath $python3)) {
              Copy-Item -LiteralPath $python -Destination $python3
          }

          & $python3 --version

      - name: Cache the RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: bin/riscv-gcc
          key: ${{ runner.os }}-xpack-riscv-gcc-${{ hashFiles('scripts/setup-xpack-riscv-gcc.cmd') }}

      - name: Remove an incomplete cached toolchain
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:GITHUB_WORKSPACE "bin\riscv-gcc"
          $gcc = Join-Path $installRoot "bin\riscv-none-elf-gcc.exe"

          if ((Test-Path -LiteralPath $installRoot) -and
              -not (Test-Path -LiteralPath $gcc)) {
              Write-Warning "Removing incomplete cached toolchain: $installRoot"
              Remove-Item -LiteralPath $installRoot -Recurse -Force
          }

      - name: Install the RISC-V toolchain
        shell: cmd
        run: call scripts\setup-xpack-riscv-gcc.cmd

      - name: Add the RISC-V toolchain to PATH
        shell: pwsh
        run: |
          $toolchainBin = Join-Path $env:GITHUB_WORKSPACE "bin\riscv-gcc\bin"
          $gcc = Join-Path $toolchainBin "riscv-none-elf-gcc.exe"

          if (-not (Test-Path -LiteralPath $gcc)) {
              throw "RISC-V GCC was not installed at $gcc"
          }

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolchainBin

      - name: "CMD: Build monitor"
        id: cmd_build_monitor
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\ci\logs mkdir build\ci\logs
          call scripts\build-xpack.cmd rebuild 64m 50000000 > build\ci\logs\cmd-build-monitor.log 2>&1
          set "STATUS=%ERRORLEVEL%"
          type build\ci\logs\cmd-build-monitor.log
          exit /b %STATUS%

      - name: "CMD: Validate monitor"
        id: cmd_validate_monitor
        continue-on-error: true
        shell: cmd
        run: |
          if not exist build\ci\logs mkdir build\ci\logs
          set "LOG=build\ci\logs\cmd-validate-monitor.log"
          set "STATUS=0"
          > "%LOG%" echo CMD monitor validation
          if not exist build\hazard3-boot-monitor.elf (
              echo ::error::Native CMD build did not create build\hazard3-boot-monitor.elf
              >> "%LOG%" echo Missing file: build\hazard3-boot-monitor.elf
              set "STATUS=1"
          )
          if not exist build\hazard3-boot-monitor.map (
              echo ::error::Native CMD build did not create build\hazard3-boot-monitor.map
              >> "%LOG%" echo Missing file: build\hazard3-boot-monitor.map
              set "STATUS=1"
          )
          for %%F in (build\hazard3-boot-monitor.elf build\hazard3-boot-monitor.map) do if exist %%F if %%~zF EQU 0 (
              echo ::error::Native CMD build created an empty file: %%F
              >> "%LOG%" echo Empty file: %%F
              set "STATUS=1"
          )
          if exist build\hazard3-boot-monitor.elf bin\riscv-gcc\bin\riscv-none-elf-size.exe build\hazard3-boot-monitor.elf >> "%LOG%" 2>&1
          type "%LOG%"
          exit /b %STATUS%

      - name: "Git Bash: Show tool versions"
        shell: bash
        run: |
          riscv-none-elf-gcc --version
          riscv-none-elf-size --version
          python3 --version

      - name: "Git Bash: Initialize required submodules"
        shell: bash
        run: ./scripts/setup-submodules.sh

      - name: "Git Bash: Verify required submodule revisions"
        shell: bash
        run: |
          status="$({
              git submodule status -- \
                  third_party/doomgeneric \
                  third_party/Hazard3
              git -C third_party/Hazard3 submodule status -- \
                  scripts \
                  example_soc/libfpga
          })"
          printf '%s\n' "${status}"
          if grep -Eq '^[+-U]' <<< "${status}"; then
              echo "A required submodule is missing or not at the recorded revision." >&2
              exit 1
          fi

      - name: "Git Bash: Build monitor configurations"
        id: bash_monitor_configs
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/ci/logs
          log_file="build/ci/logs/bash-monitor-configs.log"
          exec > >(tee "${log_file}") 2>&1

          status=0
          for profile in 64m 32m; do
              for clock_hz in 50000000 25000000; do
                  build_dir="build/ci/monitor-${profile}-${clock_hz}"
                  elf="${build_dir}/hazard3-boot-monitor.elf"
                  label="monitor profile=${profile} clock=${clock_hz}"

                  echo "::group::${label}"
                  if ! HAZARD3_BUILD_DIR="${build_dir}" \
                      HAZARD3_MEMORY_PROFILE="${profile}" \
                      HAZARD3_SYS_CLK_HZ="${clock_hz}" \
                          ./scripts/build.sh; then
                      echo "::error::Build failed: ${label}"
                      status=1
                      echo "::endgroup::"
                      continue
                  fi

                  if [[ ! -s "${elf}" ]]; then
                      echo "::error file=${elf}::Missing or empty ELF: ${label}"
                      status=1
                      echo "::endgroup::"
                      continue
                  fi
                  if ! riscv-none-elf-readelf --file-header "${elf}"; then
                      echo "::error file=${elf}::readelf failed: ${label}"
                      status=1
                  fi
                  if ! riscv-none-elf-size "${elf}"; then
                      echo "::error file=${elf}::size failed: ${label}"
                      status=1
                  fi
                  echo "::endgroup::"
              done
          done
          exit "${status}"

      - name: "Git Bash: Build Doom image configurations"
        id: bash_doom_configs
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/ci/logs
          log_file="build/ci/logs/bash-doom-configs.log"
          exec > >(tee "${log_file}") 2>&1

          status=0
          for profile in 64m 32m; do
              build_dir="build/ci/doom-${profile}"
              elf="${build_dir}/hazard3-doom.elf"
              image="${build_dir}/hazard3-doom.h3d"
              label="Doom profile=${profile}"

              echo "::group::${label}"
              if ! HAZARD3_DOOM_BUILD_DIR="${build_dir}" \
                  HAZARD3_MEMORY_PROFILE="${profile}" \
                      ./doom/build-doom-image.sh; then
                  echo "::error::Build failed: ${label}"
                  status=1
                  echo "::endgroup::"
                  continue
              fi

              if [[ ! -s "${elf}" ]]; then
                  echo "::error file=${elf}::Missing or empty ELF: ${label}"
                  status=1
              else
                  if ! riscv-none-elf-readelf --file-header "${elf}"; then
                      echo "::error file=${elf}::readelf failed: ${label}"
                      status=1
                  fi
                  if ! riscv-none-elf-size "${elf}"; then
                      echo "::error file=${elf}::size failed: ${label}"
                      status=1
                  fi
              fi

              if [[ ! -s "${image}" ]]; then
                  echo "::error file=${image}::Missing or empty H3D image: ${label}"
                  status=1
                  echo "::endgroup::"
                  continue
              fi

              if ! python3 - "${image}" <<'PY'
          import pathlib
          import struct
          import sys
          import zlib

          image_path = pathlib.Path(sys.argv[1])
          package = image_path.read_bytes()
          if len(package) < 64:
              raise SystemExit(f"{image_path}: package is shorter than its header")

          words = struct.unpack("<16I", package[:64])
          payload = package[64:]
          if words[0] != 0x31443348:
              raise SystemExit(f"{image_path}: bad H3D magic")
          if words[1] != 64:
              raise SystemExit(f"{image_path}: unsupported header size")
          if words[5] != len(payload):
              raise SystemExit(f"{image_path}: payload length mismatch")
          if (zlib.crc32(payload) & 0xFFFFFFFF) != words[9]:
              raise SystemExit(f"{image_path}: payload CRC32 mismatch")
          print(
              f"Validated {image_path}: payload={len(payload)} bytes, "
              f"CRC32=0x{words[9]:08x}"
          )
          PY
              then
                  echo "::error file=${image}::H3D package validation failed: ${label}"
                  status=1
              fi
              echo "::endgroup::"
          done
          exit "${status}"

      - name: "Git Bash: Run Doom object-size probe"
        id: doom_size_probe
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/ci/logs
          log_file="build/ci/logs/doom-size-probe.log"

          set +e
          HAZARD3_SIZE_BUILD_DIR=build/ci/doom-size-probe \
          HAZARD3_MEMORY_PROFILE=64m \
              ./doom/build-size-probe.sh 2>&1 | tee "${log_file}"
          status=${PIPESTATUS[0]}
          set -e

          exit "${status}"

      - name: "Git Bash: Verify builds did not modify submodules"
        id: submodule_cleanliness
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/ci/logs
          log_file="build/ci/logs/submodule-cleanliness.log"
          exec > >(tee "${log_file}") 2>&1

          status=0
          for repository in third_party/doomgeneric third_party/Hazard3; do
              changes="$(git -C "${repository}" status --porcelain --untracked-files=all)"
              if [[ -n "${changes}" ]]; then
                  printf '::error::Unexpected changes in %s:\n%s\n' "${repository}" "${changes}"
                  status=1
              fi
          done
          exit "${status}"

      - name: "Git Bash: Write build artifact README"
        if: always()
        shell: bash
        run: |
          mkdir -p build/ci
          cat > build/ci/README.md <<'EOF'
          # Hazard3-Doom CI build artifacts

          These files are software build products from the Git Bash CI matrix.
          They are not FPGA bitstreams. Board compatibility is determined by
          the SDRAM memory profile and, for the resident monitor, system clock.

          ## Target board profiles

          | Board | SDRAM profile | Monitor clock |
          |---|---:|---:|
          | ULX3S 85F | `64m` | 50 MHz |
          | ULX4M-LD 85F | `64m` | 25 MHz* |
          | ULX4M-LS 85F | `32m` | 50 MHz |

          * The repository's monitor build instructions currently use 25 MHz
            for ULX4M-LD. The board-profile summary elsewhere in the README
            lists 50 MHz for ULX4M-LD; this CI artifact README follows the
            explicit monitor build command and does not attempt to resolve that
            documentation discrepancy.

          ## Directory contents

          | Directory | Contents | Intended target |
          |---|---|---|
          | `doom-64m/` | Doom ELF, map, and packaged H3D image using the 64 MiB memory map | ULX3S 85F and ULX4M-LD 85F |
          | `doom-32m/` | Doom ELF, map, and packaged H3D image using the 32 MiB memory map | ULX4M-LS 85F |
          | `monitor-64m-50000000/` | Resident monitor built for 64 MiB SDRAM at 50 MHz | ULX3S 85F |
          | `monitor-64m-25000000/` | Resident monitor built for 64 MiB SDRAM at 25 MHz | ULX4M-LD 85F per the explicit monitor build instructions |
          | `monitor-32m-50000000/` | Resident monitor built for 32 MiB SDRAM at 50 MHz | ULX4M-LS 85F |
          | `monitor-32m-25000000/` | Resident monitor built for 32 MiB SDRAM at 25 MHz | CI compatibility build; no documented board target |

          ## ULX3S files

          For ULX3S 85F, use the `64m` software profile and 50 MHz monitor:

          - `doom-64m/hazard3-doom.h3d`
          - `doom-64m/hazard3-doom.elf` and `.map` for debugging/inspection
          - `monitor-64m-50000000/hazard3-boot-monitor.elf`
          - `monitor-64m-50000000/hazard3-boot-monitor.map`

          The complete ULX3S board build, including the FPGA bitstream, is made
          separately by `./scripts/build-ulx3s-doom.sh`. Its FPGA output is:

          `build/fpga_ulx3s.bit`

          That bitstream is not included in this `windows-bash-builds-*` CI
          artifact unless the workflow is separately changed to upload it.

          ## File types

          - `hazard3-boot-monitor.elf`: resident monitor firmware for JTAG/debug loading.
          - `hazard3-boot-monitor.map`: linker map for the resident monitor.
          - `hazard3-doom.elf`: linked Doom executable for debugging/inspection.
          - `hazard3-doom.map`: linker map for the Doom executable.
          - `hazard3-doom.h3d`: packaged Doom image consumed by the Hazard3 monitor/loader.

          The monitor, Doom image, and WAD uploader must use the same SDRAM
          memory profile (`64m` or `32m`).
          EOF

      - name: Upload Git Bash build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-bash-builds-${{ github.sha }}
          path: |
            build/ci/README.md
            build/ci/**/*.elf
            build/ci/**/*.map
            build/ci/**/*.h3d
            build/ci/logs/*.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Report Windows command-line build failures
        if: always()
        shell: bash
        env:
          CMD_BUILD_MONITOR_OUTCOME: ${{ steps.cmd_build_monitor.outcome }}
          CMD_VALIDATE_MONITOR_OUTCOME: ${{ steps.cmd_validate_monitor.outcome }}
          BASH_MONITOR_CONFIGS_OUTCOME: ${{ steps.bash_monitor_configs.outcome }}
          BASH_DOOM_CONFIGS_OUTCOME: ${{ steps.bash_doom_configs.outcome }}
          DOOM_SIZE_PROBE_OUTCOME: ${{ steps.doom_size_probe.outcome }}
          SUBMODULE_CLEANLINESS_OUTCOME: ${{ steps.submodule_cleanliness.outcome }}
        run: |
          status=0
          failed_count=0

          report_result() {
              local name="$1"
              local outcome="$2"
              local log_file="$3"

              if [[ "${outcome}" == "success" ]]; then
                  printf 'PASS  %s\n' "${name}"
                  return
              fi

              printf 'FAIL  %s (outcome: %s)\n' "${name}" "${outcome}"
              echo "::error title=${name}::${name} failed. Diagnostic output is included below."
              status=1
              failed_count=$((failed_count + 1))

              if [[ -f "${log_file}" ]]; then
                  echo "::group::Failure details - ${name}"
                  tail -n 100 "${log_file}"
                  echo "::endgroup::"
              else
                  echo "No saved diagnostic log was found at ${log_file}."
                  echo "Expand the failed '${name}' step above for its complete output."
              fi
          }

          echo "========================================"
          echo "Windows command-line CI summary"
          echo "========================================"

          report_result "CMD monitor build" "${CMD_BUILD_MONITOR_OUTCOME}" "build/ci/logs/cmd-build-monitor.log"
          report_result "CMD monitor validation" "${CMD_VALIDATE_MONITOR_OUTCOME}" "build/ci/logs/cmd-validate-monitor.log"
          report_result "Git Bash monitor configuration builds" "${BASH_MONITOR_CONFIGS_OUTCOME}" "build/ci/logs/bash-monitor-configs.log"
          report_result "Git Bash Doom configuration builds" "${BASH_DOOM_CONFIGS_OUTCOME}" "build/ci/logs/bash-doom-configs.log"
          report_result "Doom object-size probe" "${DOOM_SIZE_PROBE_OUTCOME}" "build/ci/logs/doom-size-probe.log"
          report_result "Submodule cleanliness check" "${SUBMODULE_CLEANLINESS_OUTCOME}" "build/ci/logs/submodule-cleanliness.log"

          echo "========================================"
          if (( failed_count == 0 )); then
              echo "All checks passed."
          else
              echo "${failed_count} check(s) failed."
              echo "Full diagnostic logs are included in the uploaded CI artifact."
          fi
          echo "========================================"

          exit "${status}"
