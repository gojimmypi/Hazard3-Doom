name: FPGA seed sweep
# The run title shows the configured hardware system clock, not the optional
# timing PASS threshold (sweep_sys_target_mhz). Changing that threshold must
# not make a 50 MHz build appear to be a different clock configuration.
# GitHub run-name can use inputs but cannot use the resolved workflow env.
# The conditions below select the clock for each board:
#   ULX3S-85F: selected clock, or 50 if the experimental checkbox is enabled.
#   ULX3S-12F: fixed 40 MHz.
#   ULX4M-LD: selected ULX4M system clock.
#   ULX5M-GS: selected ULX5M system clock (last fallback).
# The optional breadcrumb adds " - label" only when nonempty.
run-name: >-
  FPGA seed sweep${{ inputs.breadcrumb && format(' - {0}', inputs.breadcrumb) || '' }} - ${{ inputs.target }} -
  ${{ inputs.target == 'ulx3s-85f' && (inputs.ulx3s_85f_50mhz_best_config && '50' || inputs.ulx3s_85f_sys_clk_mhz) ||
      inputs.target == 'ulx3s-12f' && '40' ||
      inputs.target == 'ulx4m-ld-85f' && inputs.ulx4m_sys_clk_mhz ||
      inputs.ulx5m_sys_clk_mhz }} MHz -
  seeds ${{ inputs.seed_first }}-${{ inputs.seed_last }}
# TODO:        rename this file as it is no longer ECP5 specific
#
# ******************************************* REMINDER *******************************************
#
# When changing defaults here, also review the defaults in scripts/build-ecp5-bitstream-common.sh
#
# You may only define up to 25 `inputs` for a `workflow_dispatch` event
#
# ************************************************************************************************
on:
  workflow_dispatch:
    inputs:
      breadcrumb:
        description: Optional run title label (recommended maximum 30 characters)
        required: false
        default: ""
        type: string
      target:
        description: FPGA target to sweep
        required: true
        default: ulx3s-85f
        type: choice
        options:
          - ulx3s-85f
          - ulx3s-12f
          - ulx4m-ld-85f
          - ulx5m-gs
      seed_first:
        description: First seed to route (positive 32-bit integer)
        required: true
        default: "1"
        type: string
      seed_last:
        description: Last seed to route (maximum 512 consecutive seeds)
        required: true
        default: "50"
        type: string
      max_parallel:
        description: Maximum concurrent GitHub route jobs
        required: true
        default: "20"
        type: choice
        options:
          - "4"
          - "8"
          - "12"
          - "20"  # GitHub plan Concurrent jobs
                  # Free 20
                  # Pro 40
                  # Team 60
                  # Enterprise 500
      seeds_per_job:
        description: Seeds routed serially by each GitHub route job
        required: true
        default: "2" # Keep in mind some seed values may be long running and hit timeout.
                     # 360 minutes (6 hours) maximum for a single job, so 2 seeds per job is a good default.
                     # Typical ULX3S job is 10 minutes, but some seeds can take 30 minutes or more to route.
                     #
                     # There's a GitHub maximum of 6 hours per job.
                     # Entire workflow can take up to 35 days; includes execution, waiting, and approval time.
                     # It does not let a single hosted job run continuously for 35 days
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "9"
      retain_bitstreams:
        description: Retain per-seed bitstreams in CI artifacts when produced
        required: true
        default: false
        type: boolean
      ulx3s_85f_sys_clk_mhz:
        description: ULX3S 85F system clock (25/40/50 MHz; select actual FPGA speed grade)
        required: true
        default: "25"
        type: choice
        options:
          - "25"
          - "40"
          - "50"
      ulx3s_85f_50mhz_best_config:
        description: Experimental cache/SRAM configuration (requires experimental Hazard3 branch)
        required: true
        default: false
        type: boolean
      hdmi_output_resolution:
        description: HDMI output raster (board-default; only implemented board modes are accepted)
        required: true
        default: board-default
        type: choice
        options:
          - board-default
          - 640x480
          - 1024x600
      ulx3s_85f_extended_modes:
        description: ULX3S 85F extended HDMI modes (ignored for other targets)
        required: true
        default: "0"
        type: choice
        options:
          - "1"
          - "0"
      ulx3s_12f_memory_profile:
        description: ULX3S 12F SDRAM profile (ignored for other targets)
        required: true
        default: 32m
        type: choice
        options:
          - 32m
          - 64m
      ulx4m_sys_clk_mhz:
        description: ULX4M-LD Hazard3 system clock (ignored for other targets)
        required: true
        default: "40"
        type: choice
        options:
          - "25"
          - "40"
          - "50"
      ulx4m_litedram_cpu:
        description: ULX4M-LD LiteDRAM initialization CPU (ignored for other targets)
        required: true
        default: serv
        type: choice
        options:
          - serv
          - vexrisc
      ulx4m_heap_timingweight:
        description: ULX4M-LD HeAP timing weight (ignored for other targets)
        required: true
        default: "30"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "40"
      ulx5m_sys_clk_mhz:
        description: ULX5M-GS Hazard3 system clock (ignored for other targets)
        required: true
        default: "12"
        type: choice
        options:
          - "12"
          - "20"
          - "25"
      ulx5m_heap_beta:
        description: ULX5M-GS GateMate HeAP beta (ignored for other targets)
        required: true
        default: "0.6"
        type: choice
        options:
          - "0.4"
          - "0.5"
          - "0.6"
          - "0.7"
          - "0.8"
      ecp5_speed_grade:
        description: ECP5 nextpnr speed grade (board default is 6 for ULX3S, 8 for ULX4M)
        required: true
        default: board-default
        type: choice
        options:
          - board-default
          - "6"
          - "7"
          - "8"
      sweep_sys_target_mhz:
        description: ECP5 system timing PASS threshold (MHz; board-default follows chosen clock)
        required: true
        default: board-default
        type: choice
        options:
          - board-default
          - "12.00"
          - "20.00"
          - "25.00"
          - "40.00"
          - "50.00"
      sweep_video_target_mhz:
        description: ECP5 video timing PASS threshold (MHz; default 25 for 85F, 50 for 12F/ULX4M)
        required: true
        default: board-default
        type: choice
        options:
          - board-default
          - "25.00"
          - "50.00"
      sweep_tmds_target_mhz:
        description: ECP5 HDMI TMDS timing PASS threshold (MHz; default 125 for 85F, 250 for 12F/ULX4M)
        required: true
        default: board-default
        type: choice
        options:
          - board-default
          - "125.00"
          - "250.00"
      sweep_litedram_target_mhz:
        description: ULX4M LiteDRAM user-clock minimum Fmax for timing PASS (MHz)
        required: true
        default: "60.01"
        type: choice
        options:
          - "60.01"
      sweep_init_target_mhz:
        description: ULX4M initialization-clock minimum Fmax for timing PASS (MHz)
        required: true
        default: "25.00"
        type: choice
        options:
          - "25.00"
      placer:
        description: ECP5 nextpnr placer (ULX5M uses heap)
        required: true
        default: heap
        type: choice
        options:
          - heap
          - sa
      oss_cad_suite_version:
        description: OSS CAD Suite snapshot used for synthesis and routing
        required: true
        default: "2026-07-20"
        type: string

permissions:
  # explicit least-privilege setting for GITHUB_TOKEN, no write permissions needed
  actions: read
  contents: read

concurrency:
  group: ecp5-seed-sweep-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SWEEP_TARGET: ${{ inputs.target }}
  SWEEP_SEED_FIRST: ${{ inputs.seed_first }}
  SWEEP_SEED_LAST: ${{ inputs.seed_last }}
  SWEEP_MAX_PARALLEL: ${{ inputs.max_parallel }}
  SWEEP_SEEDS_PER_JOB: ${{ inputs.seeds_per_job }}
  RETAIN_BITSTREAMS: ${{ inputs.retain_bitstreams }}
  #
  # There was a time where different versions were used. Not recommended:
  OSS_CAD_SUITE_VERSION: ${{ inputs.oss_cad_suite_version }}
  ROUTE_OSS_CAD_SUITE_VERSION: ${{ inputs.oss_cad_suite_version }}
  #
  HAZARD3_HDMI_EXTENDED_MODES: ${{ inputs.ulx3s_85f_extended_modes }}
  # This describes an existing board output mode; it cannot change HDMI PLL/RTL.
  SWEEP_HDMI_OUTPUT_RESOLUTION: ${{ inputs.hdmi_output_resolution == 'board-default' && (inputs.target == 'ulx3s-85f' && '640x480' || inputs.target == 'ulx5m-gs' && 'headless' || '1024x600') || inputs.hdmi_output_resolution }}
  # The 25 MHz path remains the default; 40/50 MHz use a system PLL.
  # Routing grade must match the FPGA actually installed on the board.
  HAZARD3_ULX3S_85F_SYS_CLK_MHZ: ${{ inputs.ulx3s_85f_50mhz_best_config && '50' || inputs.ulx3s_85f_sys_clk_mhz }}
  HAZARD3_ULX3S_85F_REGISTERED_READ_HITS: ${{ inputs.ulx3s_85f_50mhz_best_config && '1' || '0' }}
  HAZARD3_ULX3S_85F_SRAM_WRITE_BUFFER: "1"
  HAZARD3_ULX3S_85F_SRAM_DUAL_PORT_RW: ${{ inputs.ulx3s_85f_50mhz_best_config && '1' || '0' }}
  HAZARD3_ULX3S_85F_CACHE_TAG_PIPELINE: "0"
  HAZARD3_ULX3S_85F_TAG_RAM_MODE: "0"
  HAZARD3_ULX3S_85F_CACHE_ADDR_PIPELINE: "0"
  HAZARD3_MEMORY_PROFILE: ${{ inputs.ulx3s_12f_memory_profile }}
  HAZARD3_ULX4M_SYS_CLK_MHZ: ${{ inputs.ulx4m_sys_clk_mhz }}
  ULX4M_LITEDRAM_CPU: ${{ inputs.ulx4m_litedram_cpu }}
  ULX5M_SYS_CLK_MHZ: ${{ inputs.ulx5m_sys_clk_mhz }}
  SWEEP_ULX5M_HEAP_BETA: ${{ inputs.ulx5m_heap_beta }}
  # These are minimum achieved Fmax values for timing qualification.
  # They do not change the actual PLL frequencies or nextpnr constraints.
  # Keep board-default unless intentionally testing a stricter timing goal.
  ECP5_PNR_SPEED_GRADE: ${{ inputs.ecp5_speed_grade == 'board-default' && (inputs.target == 'ulx4m-ld-85f' && '8' || '6') || inputs.ecp5_speed_grade }}
  ECP5_PNR_PACKAGE: "CABGA381"
  SWEEP_SYS_TARGET_MHZ: ${{ inputs.sweep_sys_target_mhz == 'board-default' && (inputs.target == 'ulx3s-85f' && (inputs.ulx3s_85f_50mhz_best_config && '50.00' || format('{0}.00', inputs.ulx3s_85f_sys_clk_mhz)) || inputs.target == 'ulx3s-12f' && '40.00' || inputs.target == 'ulx4m-ld-85f' && format('{0}.00', inputs.ulx4m_sys_clk_mhz) || format('{0}.00', inputs.ulx5m_sys_clk_mhz)) || inputs.sweep_sys_target_mhz }}
  SWEEP_VIDEO_TARGET_MHZ: ${{ inputs.sweep_video_target_mhz == 'board-default' && (inputs.target == 'ulx3s-85f' && '25.00' || '50.00') || inputs.sweep_video_target_mhz }}
  SWEEP_TMDS_TARGET_MHZ: ${{ inputs.sweep_tmds_target_mhz == 'board-default' && (inputs.target == 'ulx3s-85f' && '125.00' || '250.00') || inputs.sweep_tmds_target_mhz }}
  SWEEP_LITEDRAM_TARGET_MHZ: ${{ inputs.sweep_litedram_target_mhz }}
  SWEEP_INIT_TARGET_MHZ: ${{ inputs.sweep_init_target_mhz }}
  SWEEP_NEXTPNR_PLACER: ${{ inputs.target == 'ulx5m-gs' && 'heap' || inputs.placer }}
  SWEEP_NEXTPNR_ROUTER: ${{ inputs.target == 'ulx5m-gs' && 'router2' || 'router1' }}
  SWEEP_NEXTPNR_HEAP_TIMINGWEIGHT: ${{ inputs.target == 'ulx4m-ld-85f' && inputs.ulx4m_heap_timingweight || '10' }}
  SWEEP_NEXTPNR_HEAP_CRITEXP: "2"
  SWEEP_NEXTPNR_TMG_RIPUP: "false"
  SWEEP_NEXTPNR_ROUTER2_ALT_WEIGHTS: "false"
  SWEEP_NEXTPNR_EXTRA_ARGS: ""
  # GateMate router2 can occasionally stall on one remaining overused wire.
  # Give ULX5M nine minutes to route and ten minutes total per seed so a
  # pathological route cannot monopolize a runner. Preserve the established
  # ECP5 watchdog values for the other targets.
  SWEEP_ROUTE_TIMEOUT_SECONDS: ${{ inputs.target == 'ulx5m-gs' && '540' || '7200' }}
  SWEEP_ROUTE_KILL_AFTER_SECONDS: "30"
  SWEEP_SEED_TIMEOUT_SECONDS: ${{ inputs.target == 'ulx5m-gs' && '600' || '7600' }}
  SWEEP_SEED_KILL_AFTER_SECONDS: "30"
  XPACK_RISCV_GCC_VERSION: "15.2.0-1"
  XPACK_RISCV_GCC_LINUX_SHA256: "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758"

jobs:
  prepare:
    name: Prepare frozen ${{ inputs.target }} netlist
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      TOOLCHAIN_PREFIX: ${{ github.workspace }}/bin/riscv-gcc/bin/riscv-none-elf-

    steps:
      # Print inputs before checkout or toolchain installation so even an early
      # failure leaves a visible configuration record in the logs and summary.
      - name: Show parameters
        shell: bash
        env:
          DISPATCH_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          inputs = json.loads(os.environ["DISPATCH_INPUTS_JSON"])
          target = os.environ["SWEEP_TARGET"]
          actual_mhz = {
              "ulx3s-85f": os.environ["HAZARD3_ULX3S_85F_SYS_CLK_MHZ"],
              "ulx3s-12f": "40",
              "ulx4m-ld-85f": os.environ["HAZARD3_ULX4M_SYS_CLK_MHZ"],
              "ulx5m-gs": os.environ["ULX5M_SYS_CLK_MHZ"],
          }[target]

          resolved = [
              ("FPGA target", target),
              ("Seed range", f'{os.environ["SWEEP_SEED_FIRST"]}-{os.environ["SWEEP_SEED_LAST"]}'),
              ("Configured system clock (MHz)", actual_mhz),
              ("HDMI output", os.environ["SWEEP_HDMI_OUTPUT_RESOLUTION"]),
              ("Maximum parallel jobs", os.environ["SWEEP_MAX_PARALLEL"]),
              ("Seeds per job", os.environ["SWEEP_SEEDS_PER_JOB"]),
              ("Retain bitstreams", os.environ["RETAIN_BITSTREAMS"]),
              ("OSS CAD Suite (synthesis and routing)", os.environ["OSS_CAD_SUITE_VERSION"]),
              ("nextpnr placer", os.environ["SWEEP_NEXTPNR_PLACER"]),
              ("nextpnr router", os.environ["SWEEP_NEXTPNR_ROUTER"]),
              ("HeAP timing weight", os.environ["SWEEP_NEXTPNR_HEAP_TIMINGWEIGHT"]),
              ("HeAP criticality exponent", os.environ["SWEEP_NEXTPNR_HEAP_CRITEXP"]),
              ("Timing-driven rip-up", os.environ["SWEEP_NEXTPNR_TMG_RIPUP"]),
              ("Router2 alternate weights", os.environ["SWEEP_NEXTPNR_ROUTER2_ALT_WEIGHTS"]),
              ("Additional nextpnr arguments", os.environ["SWEEP_NEXTPNR_EXTRA_ARGS"]),
              ("Route timeout (seconds)", os.environ["SWEEP_ROUTE_TIMEOUT_SECONDS"]),
              ("Seed timeout (seconds)", os.environ["SWEEP_SEED_TIMEOUT_SECONDS"]),
          ]
          if target != "ulx5m-gs":
              resolved += [
                  ("Minimum system Fmax for PASS (MHz)", os.environ["SWEEP_SYS_TARGET_MHZ"]),
                  ("Minimum video Fmax for PASS (MHz)", os.environ["SWEEP_VIDEO_TARGET_MHZ"]),
                  ("Minimum HDMI TMDS Fmax for PASS (MHz)", os.environ["SWEEP_TMDS_TARGET_MHZ"]),
                  ("ECP5 speed grade", os.environ["ECP5_PNR_SPEED_GRADE"]),
                  ("ECP5 package", os.environ["ECP5_PNR_PACKAGE"]),
              ]
          if target == "ulx3s-85f":
              resolved += [
                  ("Registered cache read hits", os.environ["HAZARD3_ULX3S_85F_REGISTERED_READ_HITS"]),
                  ("SRAM write buffer", os.environ["HAZARD3_ULX3S_85F_SRAM_WRITE_BUFFER"]),
                  ("SRAM dual-port read/write", os.environ["HAZARD3_ULX3S_85F_SRAM_DUAL_PORT_RW"]),
              ]
          elif target == "ulx3s-12f":
              resolved.append(("SDRAM memory profile", os.environ["HAZARD3_MEMORY_PROFILE"]))
          elif target == "ulx4m-ld-85f":
              resolved += [
                  ("LiteDRAM initialization CPU", os.environ["ULX4M_LITEDRAM_CPU"]),
                  ("Minimum LiteDRAM Fmax for PASS (MHz)", os.environ["SWEEP_LITEDRAM_TARGET_MHZ"]),
                  ("Minimum initialization Fmax for PASS (MHz)", os.environ["SWEEP_INIT_TARGET_MHZ"]),
              ]
          elif target == "ulx5m-gs":
              resolved.append(("GateMate HeAP beta", os.environ["SWEEP_ULX5M_HEAP_BETA"]))

          print("=== Resolved sweep configuration ===", flush=True)
          for name, value in resolved:
              print(f"  {name}: {value}")
          print(f"\n=== Workflow dispatch inputs ({len(inputs)}) ===")
          for name, value in inputs.items():
              print(f"  {name}: {json.dumps(value, ensure_ascii=True)}")

          # Also publish a searchable table in the GitHub Actions run summary.
          def markdown_value(value):
              return str(value).replace("\\", "\\\\").replace("|", "\\|").replace("`", "\\`").replace("\n", " ")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## FPGA seed sweep parameters\n\n")
              summary.write("### Resolved configuration\n\n| Parameter | Value |\n| --- | --- |\n")
              for name, value in resolved:
                  summary.write(f"| {markdown_value(name)} | `{markdown_value(value)}` |\n")
              summary.write(f"\n### Dispatch inputs ({len(inputs)})\n\n| Input | Selected value |\n| --- | --- |\n")
              for name, value in inputs.items():
                  summary.write(f"| `{markdown_value(name)}` | `{markdown_value(json.dumps(value, ensure_ascii=True))}` |\n")
              summary.write("\nTiming thresholds affect PASS/FAIL qualification, not the physical PLL frequencies.\n")
          PY

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate sweep inputs
        shell: bash
        run: |
          set -euo pipefail

          # The normal 40/50 MHz clock modes do not require the experimental
          # registered-cache/dual-port SRAM changes from the saved branch.
          if [[ "${SWEEP_TARGET}" == "ulx3s-85f" &&
                "${HAZARD3_ULX3S_85F_SRAM_DUAL_PORT_RW}" == "1" ]]; then
              echo '::error::The experimental cache/SRAM profile requires the separate experimental Hazard3 branch.' >&2
              exit 1
          fi

          # Validate the seed range with the same generator used for the matrix.
          # Accept any positive signed 32-bit starting seed, up to 512 seeds;
          # GitHub Actions limits the generated matrix to 256 route jobs.
          ./scripts/generate-ecp5-seed-matrix.py \
              --first "${SWEEP_SEED_FIRST}" \
              --last "${SWEEP_SEED_LAST}" \
              --per-job "${SWEEP_SEEDS_PER_JOB}" >/dev/null

          # Only the existing, board-specific HDMI timings are implemented.
          # Reject cross-board combinations instead of changing display text alone.
          case "${SWEEP_TARGET}" in
            ulx3s-85f) expected_hdmi_resolution=640x480 ;;
            ulx3s-12f|ulx4m-ld-85f) expected_hdmi_resolution=1024x600 ;;
            ulx5m-gs) expected_hdmi_resolution=headless ;;
            *) echo "Unknown target: ${SWEEP_TARGET}" >&2; exit 1 ;;
          esac
          if [[ "${SWEEP_HDMI_OUTPUT_RESOLUTION}" != "${expected_hdmi_resolution}" ]]; then
              printf 'Invalid HDMI output resolution %s for %s; this target implements %s.\n' \
                  "${SWEEP_HDMI_OUTPUT_RESOLUTION}" "${SWEEP_TARGET}" "${expected_hdmi_resolution}" >&2
              echo 'Changing the physical HDMI resolution requires RTL/PLL changes, not a sweep override.' >&2
              exit 1
          fi
          printf 'HDMI output resolution: %s\n' "${SWEEP_HDMI_OUTPUT_RESOLUTION}"

          if [[ ! "${SWEEP_MAX_PARALLEL}" =~ ^[1-9][0-9]*$ ]]; then
              echo "max_parallel must be a positive integer." >&2
              exit 1
          fi

          if [[ ! "${SWEEP_SEEDS_PER_JOB}" =~ ^[1-9]$ ]]; then
              echo "seeds_per_job must be an integer from 1 through 9." >&2
              exit 1
          fi

          chmod +x \
              scripts/sweep-ecp5.sh \
              scripts/sweep-ecp5-common.sh \
              scripts/sweep-ulx3s-85f.sh \
              scripts/sweep-ulx3s-12f.sh \
              scripts/sweep-ulx4m-ld.sh \
              scripts/sweep-ulx5m-gs.sh

          ./scripts/sweep-ecp5.sh --list-targets | grep -Fxq "${SWEEP_TARGET}"
          ./scripts/sweep-ecp5.sh --print-sweep-dir "${SWEEP_TARGET}"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends make

      - name: Cache the RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: bin/riscv-gcc
          key: Linux-xpack-riscv-gcc-${{ env.XPACK_RISCV_GCC_VERSION }}

      - name: Install the pinned RISC-V toolchain
        shell: bash
        run: |
          set -euo pipefail

          install_root="${GITHUB_WORKSPACE}/bin/riscv-gcc"
          gcc="${install_root}/bin/riscv-none-elf-gcc"

          if [[ -d "${install_root}" && ! -x "${gcc}" ]]; then
              rm -rf -- "${install_root}"
          fi

          if [[ ! -x "${gcc}" ]]; then
              archive_name="xpack-riscv-none-elf-gcc-${XPACK_RISCV_GCC_VERSION}-linux-x64.tar.gz"
              archive="${RUNNER_TEMP}/${archive_name}"
              url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_RISCV_GCC_VERSION}/${archive_name}"

              curl --fail --location --retry 3 --output "${archive}" "${url}"
              printf '%s  %s\n' "${XPACK_RISCV_GCC_LINUX_SHA256}" "${archive}" \
                  | sha256sum --check -
              mkdir -p -- "${install_root}"
              tar -xzf "${archive}" --strip-components=1 -C "${install_root}"
          fi

          "${gcc}" --version

      - name: Restore synthesis OSS CAD Suite cache
        id: synth-oss-cad-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}-v1

      - name: Set up synthesis OSS CAD Suite
        if: steps.synth-oss-cad-cache.outputs.cache-hit != 'true'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}

      - name: Activate cached synthesis OSS CAD Suite
        if: steps.synth-oss-cad-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/yosys"
          if [[ "${SWEEP_TARGET}" == "ulx5m-gs" ]]; then
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-himbaechel"
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/gmpack"
          else
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5"
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/ecppack"
          fi
          printf '%s\n' "${RUNNER_TEMP}/oss-cad-suite/bin" >> "${GITHUB_PATH}"

      - name: Save synthesis OSS CAD Suite cache
        if: steps.synth-oss-cad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}-v1

      - name: Initialize synthesis submodules
        shell: bash
        run: |
          git submodule sync -- third_party/Hazard3
          git submodule update --init third_party/Hazard3
          git -C third_party/Hazard3 submodule sync -- \
              scripts \
              example_soc/libfpga
          git -C third_party/Hazard3 submodule update --init -- \
              scripts \
              example_soc/libfpga

      - name: Show synthesis tool versions
        shell: bash
        run: |
          yosys --version
          if [[ "${SWEEP_TARGET}" == "ulx5m-gs" ]]; then
              nextpnr-himbaechel --version
              printf 'gmpack: %s\n' "$(command -v gmpack)"
          else
              nextpnr-ecp5 --version
              printf 'ecppack: %s\n' "$(command -v ecppack)"
          fi
          "${TOOLCHAIN_PREFIX}gcc" --version
          python3 --version

      - name: Prepare frozen target netlist
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
              scripts/sweep-ecp5.sh \
              scripts/sweep-ecp5-common.sh \
              scripts/sweep-ulx3s-85f.sh \
              scripts/sweep-ulx3s-12f.sh \
              scripts/sweep-ulx4m-ld.sh \
              scripts/sweep-ulx5m-gs.sh

          if [[ "${SWEEP_TARGET}" == "ulx3s-85f" &&
                "${HAZARD3_ULX3S_85F_SYS_CLK_MHZ}" != "25" ]]; then
              # Check the checked-out gitlink, not an unrelated workspace file.
              synth_makefile=third_party/Hazard3/example_soc/synth/ULX3S.mk
              fpga_rtl=third_party/Hazard3/example_soc/fpga/fpga_ulx3s.v
              if ! grep -Fq 'DEFINES += HAZARD3_ULX3S_85F_SYS_CLK_MHZ=' "${synth_makefile}" ||
                 ! grep -Fq 'gen_clk_sys_50' "${fpga_rtl}"; then
                  echo '::error::Pinned Hazard3 submodule does not implement the requested ULX3S-85F system PLL.' >&2
                  exit 1
              fi
          fi

          monitor_memory_profile=64m
          case "${SWEEP_TARGET}" in
          ulx3s-85f)
              monitor_clock_hz="$((HAZARD3_ULX3S_85F_SYS_CLK_MHZ * 1000000))"
              ;;
          ulx4m-ld-85f)
              monitor_clock_hz="$((HAZARD3_ULX4M_SYS_CLK_MHZ * 1000000))"
              ;;
          ulx5m-gs)
              monitor_clock_hz="$((ULX5M_SYS_CLK_MHZ * 1000000))"
              monitor_memory_profile=32m
              ;;
          ulx3s-12f)
              monitor_clock_hz=""
              ;;
          esac

          if [[ -n "${monitor_clock_hz}" ]]; then
              HAZARD3_BUILD_DIR=build/sweep-monitor \
              HAZARD3_MEMORY_PROFILE="${monitor_memory_profile}" \
              HAZARD3_SYS_CLK_HZ="${monitor_clock_hz}" \
                  ./scripts/build.sh
              ./scripts/make-boot-hex.py \
                  build/sweep-monitor/hazard3-boot-monitor.bin \
                  third_party/Hazard3/example_soc/soc/hazard3-boot-monitor.hex \
                  --bytes 0x10000 \
                  --load-address 0x40
              test -s third_party/Hazard3/example_soc/soc/hazard3-boot-monitor.hex
              if [[ "${SWEEP_TARGET}" == "ulx3s-85f" ]]; then
                  mkdir -p build/ulx3s-85f
                  printf '%s\n' "${HAZARD3_ULX3S_85F_SYS_CLK_MHZ}" \
                      > build/ulx3s-85f/monitor-sys-clk-mhz
              fi
          fi

          ./scripts/sweep-ecp5.sh --prepare "${SWEEP_TARGET}"

          sweep_dir="$(
              ./scripts/sweep-ecp5.sh --print-sweep-dir "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          netlist="$(
              ./scripts/sweep-ecp5.sh --print-netlist "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          route_constraint="$(
              ./scripts/sweep-ecp5.sh --print-constraint "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          timing_constraint="$(
              ./scripts/sweep-ecp5.sh --print-timing-constraint "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          metadata="${sweep_dir}/metadata.txt"

          printf 'Resolved sweep directory: %s\n' "${sweep_dir}"
          printf 'Resolved netlist: %s\n' "${netlist}"
          printf 'Resolved route constraint: %s\n' "${route_constraint}"
          printf 'Resolved timing constraint: %s\n' "${timing_constraint:-none}"
          printf 'Resolved metadata: %s\n' "${metadata}"

          if [[ -z "${sweep_dir}" ]]; then
              echo '::error::Sweep directory query returned an empty value.' >&2
              exit 1
          fi
          if [[ -z "${netlist}" ]]; then
              echo '::error::Netlist query returned an empty value.' >&2
              exit 1
          fi
          if [[ ! -s "${netlist}" ]]; then
              printf '::error::Frozen netlist is missing or empty: %s\n' "${netlist}" >&2
              exit 1
          fi
          # In 40/50 MHz mode the 85F netlist must have both the system and
          # video PLLs. A 25 MHz oscillator-only system has just the video PLL.
          if [[ "${SWEEP_TARGET}" == "ulx3s-85f" &&
                "${HAZARD3_ULX3S_85F_SYS_CLK_MHZ}" != "25" ]]; then
              python3 - "${netlist}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              netlist = json.load(handle)

          pll_count = sum(
              cell.get("type") == "EHXPLLL"
              for module in netlist["modules"].values()
              for cell in module.get("cells", {}).values()
          )
          if pll_count != 2:
              print(f"::error::Expected system and video PLLs, found {pll_count}.")
              raise SystemExit(1)
          print("Synthesized ULX3S-85F system and video PLLs verified.")
          PY
          fi

          if [[ -z "${route_constraint}" ]]; then
              echo '::error::Route constraint query returned an empty value.' >&2
              exit 1
          fi
          if [[ ! -s "${route_constraint}" ]]; then
              printf '::error::Route constraint is missing or empty: %s\n' "${route_constraint}" >&2
              exit 1
          fi
          if [[ -n "${timing_constraint}" && ! -s "${timing_constraint}" ]]; then
              printf '::error::Timing constraint is missing or empty: %s\n' "${timing_constraint}" >&2
              exit 1
          fi
          if [[ ! -s "${metadata}" ]]; then
              printf '::error::Sweep metadata is missing or empty: %s\n' "${metadata}" >&2
              find build -maxdepth 3 -name metadata.txt -print >&2 || true
              exit 1
          fi

          mkdir -p reference
          cp "${metadata}" reference/sweep-metadata.txt
          sha256sum "${netlist}" > reference/netlist.sha256
          printf '%s\n' "${route_constraint}" > reference/route-constraint.txt
          sha256sum "${route_constraint}" > reference/route-constraint.sha256
          printf '%s\n' "${timing_constraint}" > reference/timing-constraint.txt
          if [[ -n "${timing_constraint}" ]]; then
              sha256sum "${timing_constraint}" > reference/timing-constraint.sha256
          else
              : > reference/timing-constraint.sha256
          fi

          git rev-parse HEAD > reference/hazard3-doom-head.txt
          git ls-tree HEAD third_party/Hazard3 > reference/hazard3-doom-hazard3-gitlink.txt
          git -C third_party/Hazard3 rev-parse HEAD > reference/hazard3-head.txt
          git -C third_party/Hazard3 ls-tree HEAD example_soc/libfpga \
              > reference/hazard3-libfpga-gitlink.txt
          git -C third_party/Hazard3 ls-tree HEAD scripts \
              > reference/hazard3-scripts-gitlink.txt

          {
              yosys --version
              if [[ "${SWEEP_TARGET}" == "ulx5m-gs" ]]; then
                  nextpnr-himbaechel --version
                  printf 'gmpack: %s\n' "$(command -v gmpack)"
              else
                  nextpnr-ecp5 --version
                  printf 'ecppack: %s\n' "$(command -v ecppack)"
              fi
          } > reference/synthesis-tool-versions.txt

          {
              printf 'target=%s\n' "${SWEEP_TARGET}"
              printf 'seed_first=%s\n' "${SWEEP_SEED_FIRST}"
              printf 'seed_last=%s\n' "${SWEEP_SEED_LAST}"
              printf 'max_parallel=%s\n' "${SWEEP_MAX_PARALLEL}"
              printf 'seeds_per_job=%s\n' "${SWEEP_SEEDS_PER_JOB}"
              printf 'retain_bitstreams=%s\n' "${RETAIN_BITSTREAMS}"
              printf 'synth_oss_cad_suite_version=%s\n' "${OSS_CAD_SUITE_VERSION}"
              printf 'route_oss_cad_suite_version=%s\n' "${OSS_CAD_SUITE_VERSION}"
              printf 'ulx3s_85f_extended_modes=%s\n' "${HAZARD3_HDMI_EXTENDED_MODES}"
              printf 'hdmi_output_resolution=%s\n' "${SWEEP_HDMI_OUTPUT_RESOLUTION}"
              printf 'ulx3s_12f_memory_profile=%s\n' "${HAZARD3_MEMORY_PROFILE}"
              printf 'ulx4m_sys_clk_mhz=%s\n' "${HAZARD3_ULX4M_SYS_CLK_MHZ}"
              printf 'ulx4m_litedram_cpu=%s\n' "${ULX4M_LITEDRAM_CPU}"
              printf 'ulx5m_sys_clk_mhz=%s\n' "${ULX5M_SYS_CLK_MHZ}"
              printf 'ulx5m_heap_beta=%s\n' "${SWEEP_ULX5M_HEAP_BETA}"
              printf 'placer=%s\n' "${SWEEP_NEXTPNR_PLACER}"
              printf 'router=%s\n' "${SWEEP_NEXTPNR_ROUTER}"
              printf 'heap_timingweight=%s\n' "${SWEEP_NEXTPNR_HEAP_TIMINGWEIGHT}"
              printf 'heap_critexp=%s\n' "${SWEEP_NEXTPNR_HEAP_CRITEXP}"
              printf 'tmg_ripup=%s\n' "${SWEEP_NEXTPNR_TMG_RIPUP}"
              printf 'router2_alt_weights=%s\n' "${SWEEP_NEXTPNR_ROUTER2_ALT_WEIGHTS}"
              printf 'nextpnr_extra_args=%s\n' "${SWEEP_NEXTPNR_EXTRA_ARGS}"
              printf 'route_timeout_seconds=%s\n' "${SWEEP_ROUTE_TIMEOUT_SECONDS}"
              printf 'route_kill_after_seconds=%s\n' "${SWEEP_ROUTE_KILL_AFTER_SECONDS}"
              printf 'seed_timeout_seconds=%s\n' "${SWEEP_SEED_TIMEOUT_SECONDS}"
              printf 'seed_kill_after_seconds=%s\n' "${SWEEP_SEED_KILL_AFTER_SECONDS}"
              printf 'sweep_dir=%s\n' "${sweep_dir}"
              printf 'netlist=%s\n' "${netlist}"
              printf 'route_constraint=%s\n' "${route_constraint}"
              printf 'timing_constraint=%s\n' "${timing_constraint}"
          } > reference/workflow.txt

      - name: Generate seed matrix
        id: matrix
        shell: bash
        run: |
          matrix="$(
              ./scripts/generate-ecp5-seed-matrix.py \
                  --first "${SWEEP_SEED_FIRST}" \
                  --last "${SWEEP_SEED_LAST}" \
                  --per-job "${SWEEP_SEEDS_PER_JOB}"
          )"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Record route nextpnr version
        shell: bash
        run: |
          if [[ "${SWEEP_TARGET}" == "ulx5m-gs" ]]; then
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-himbaechel"
              "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-himbaechel" --version \
                  | tee reference/route-nextpnr-version.txt
          else
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5"
              "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5" --version \
                  | tee reference/route-nextpnr-version.txt
          fi

      - name: Package frozen route inputs
        shell: bash
        run: |
          set -euo pipefail

          route_constraint="$(cat reference/route-constraint.txt)"
          timing_constraint="$(cat reference/timing-constraint.txt)"
          test -s "${route_constraint}"
          sha256sum --check reference/route-constraint.sha256

          route_inputs=(reference build "${route_constraint}")
          if [[ -n "${timing_constraint}" ]]; then
              test -s "${timing_constraint}"
              sha256sum --check reference/timing-constraint.sha256
              route_inputs+=("${timing_constraint}")
          fi

          tar \
              -czf "${RUNNER_TEMP}/ecp5-sweep-inputs.tar.gz" \
              "${route_inputs[@]}"

      - name: Upload frozen route inputs
        uses: actions/upload-artifact@v7
        with:
          name: ecp5-sweep-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/ecp5-sweep-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  watch:
    name: LIVE timing-pass collector (${{ inputs.target }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out live result watcher
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Watch completed seed groups
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Watcher inputs:\n'
          printf '  SWEEP_TARGET:        %s\n' "${SWEEP_TARGET}"
          printf '  SWEEP_SEED_FIRST:    %s\n' "${SWEEP_SEED_FIRST}"
          printf '  SWEEP_SEED_LAST:     %s\n' "${SWEEP_SEED_LAST}"
          printf '  SWEEP_SEEDS_PER_JOB: %s\n' "${SWEEP_SEEDS_PER_JOB}"
          printf '  HDMI output resolution: %s\n' "${SWEEP_HDMI_OUTPUT_RESOLUTION}"
          case "${SWEEP_TARGET}" in
          ulx3s-85f)
              printf '  System clock:            %s MHz (640x480 HDMI)\n' "${HAZARD3_ULX3S_85F_SYS_CLK_MHZ}"
              printf '  HAZARD3_HDMI_EXTENDED_MODES: %s\n' "${HAZARD3_HDMI_EXTENDED_MODES}"
              ;;
          ulx3s-12f)
              printf '  System clock:            40 MHz (fixed)\n'
              printf '  HAZARD3_MEMORY_PROFILE: %s\n' "${HAZARD3_MEMORY_PROFILE}"
              ;;
          ulx4m-ld-85f)
              printf '  HAZARD3_ULX4M_SYS_CLK_MHZ: %s\n' "${HAZARD3_ULX4M_SYS_CLK_MHZ}"
              printf '  ULX4M_LITEDRAM_CPU:         %s\n' "${ULX4M_LITEDRAM_CPU}"
              ;;
          ulx5m-gs)
              printf '  System clock:          %s MHz\n' "${ULX5M_SYS_CLK_MHZ}"
              printf '  SWEEP_ULX5M_HEAP_BETA: %s\n' "${SWEEP_ULX5M_HEAP_BETA}"
              ;;
          esac

          printf 'Calling: ./scripts/watch-ecp5-sweep-results.sh %s %s %s %s\n' \
              "${SWEEP_TARGET}" \
              "${SWEEP_SEED_FIRST}" \
              "${SWEEP_SEED_LAST}" \
              "${SWEEP_SEEDS_PER_JOB}"

          chmod +x scripts/watch-ecp5-sweep-results.sh

          ./scripts/watch-ecp5-sweep-results.sh \
              "${SWEEP_TARGET}" \
              "${SWEEP_SEED_FIRST}" \
              "${SWEEP_SEED_LAST}" \
              "${SWEEP_SEEDS_PER_JOB}"

  route:
    name: ${{ inputs.target }} seeds ${{ matrix.seeds }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out sweep scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore route OSS CAD Suite cache
        id: route-oss-cad-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}-v1

      - name: Activate route OSS CAD Suite
        shell: bash
        env:
          CACHE_HIT: ${{ steps.route-oss-cad-cache.outputs.cache-hit }}
        run: |
          if [[ "${CACHE_HIT}" != "true" ]]; then
              echo "Route OSS CAD Suite cache was not available." >&2
              exit 1
          fi
          if [[ "${SWEEP_TARGET}" == "ulx5m-gs" ]]; then
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-himbaechel"
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/gmpack"
          else
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5"
              test -x "${RUNNER_TEMP}/oss-cad-suite/bin/ecppack"
          fi
          printf '%s\n' "${RUNNER_TEMP}/oss-cad-suite/bin" >> "${GITHUB_PATH}"

      - name: Download frozen route inputs
        uses: actions/download-artifact@v8
        with:
          name: ecp5-sweep-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/sweep-inputs

      - name: Extract and verify frozen route inputs
        shell: bash
        run: |
          set -euo pipefail

          tar -xzf "${RUNNER_TEMP}/sweep-inputs/ecp5-sweep-inputs.tar.gz" \
              -C "${GITHUB_WORKSPACE}"

          route_constraint="$(cat reference/route-constraint.txt)"
          timing_constraint="$(cat reference/timing-constraint.txt)"
          test -s "${route_constraint}"
          sha256sum --check reference/route-constraint.sha256
          if [[ -n "${timing_constraint}" ]]; then
              test -s "${timing_constraint}"
              sha256sum --check reference/timing-constraint.sha256
          fi

          chmod +x \
              scripts/sweep-ecp5.sh \
              scripts/sweep-ecp5-common.sh \
              scripts/sweep-ulx3s-85f.sh \
              scripts/sweep-ulx3s-12f.sh \
              scripts/sweep-ulx4m-ld.sh \
              scripts/sweep-ulx5m-gs.sh

          netlist="$(
              ./scripts/sweep-ecp5.sh --print-netlist "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          expected_sha="$(awk '{print $1}' reference/netlist.sha256)"
          actual_sha="$(sha256sum "${netlist}" | awk '{print $1}')"
          printf 'Frozen netlist SHA256: %s\n' "${actual_sha}"
          test "${actual_sha}" = "${expected_sha}"

      - name: Show route tool version
        shell: bash
        run: |
          if [[ "${SWEEP_TARGET}" == "ulx5m-gs" ]]; then
              nextpnr-himbaechel --version
              printf 'gmpack: %s\n' "$(command -v gmpack)"
          else
              nextpnr-ecp5 --version
              printf 'ecppack: %s\n' "$(command -v ecppack)"
          fi

      - name: Route seed group
        id: route
        shell: bash
        run: |
          set -u -o pipefail

          sweep_dir="$(
              ./scripts/sweep-ecp5.sh --print-sweep-dir "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          netlist="$(
              ./scripts/sweep-ecp5.sh --print-netlist "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          expected_sha="$(awk '{print $1}' reference/netlist.sha256)"
          artifact_dir="seed-artifact"
          overall_status=0
          mkdir -p "${artifact_dir}"

          for seed in ${{ matrix.seeds }}; do
              printf '\n============================================================\n'
              printf 'Routing %s seed %s\n' "${SWEEP_TARGET}" "${seed}"
              printf '============================================================\n'

              start_seconds="$(date +%s)"
              set +e
              SWEEP_JOBS=1 SWEEP_SKIP_SYNTH=1 \
                  timeout \
                      --signal=TERM \
                      --kill-after="${SWEEP_SEED_KILL_AFTER_SECONDS}s" \
                      "${SWEEP_SEED_TIMEOUT_SECONDS}s" \
                      ./scripts/sweep-ecp5.sh "${SWEEP_TARGET}" "${seed}" \
                  |& tee "${artifact_dir}/console-${seed}.log"
              route_status=${PIPESTATUS[0]}
              set -e
              end_seconds="$(date +%s)"

              printf '%s\n' "$((end_seconds - start_seconds))" \
                  > "${artifact_dir}/elapsed-${seed}.txt"
              printf '%s\n' "${route_status}" \
                  > "${artifact_dir}/exit-${seed}.txt"

              result="${sweep_dir}/result-seed-${seed}.csv"
              if [[ -f "${result}" ]]; then
                  cp "${result}" "${artifact_dir}/"
              fi

              shopt -s nullglob
              logs=(
                  "${sweep_dir}/pnr-${seed}.log"
                  "${sweep_dir}/seed-${seed}.log"
                  "${sweep_dir}/pnr-${seed}-failed.log"
              )
              for file in "${logs[@]}"; do
                  [[ -f "${file}" ]] && cp "${file}" "${artifact_dir}/"
              done

              if [[ "${RETAIN_BITSTREAMS}" == "true" || "${RETAIN_BITSTREAMS}" == "1" ]]; then
                  bits=("${sweep_dir}"/*-"${seed}".bit)
                  for file in "${bits[@]}"; do
                      [[ -f "${file}" ]] && cp "${file}" "${artifact_dir}/"
                  done
              fi
              shopt -u nullglob

              actual_sha="$(sha256sum "${netlist}" | awk '{print $1}')"
              printf '%s\n' "${actual_sha}" \
                  > "${artifact_dir}/netlist-sha256-${seed}.txt"

              if [[ "${actual_sha}" != "${expected_sha}" ]]; then
                  echo "Seed ${seed} changed the frozen synthesized netlist." >&2
                  overall_status=1
              fi
              case "${route_status}" in
              0)
                  ;;
              124|137)
                  echo "Seed ${seed} exceeded the whole-seed watchdog (${SWEEP_SEED_TIMEOUT_SECONDS}s, status ${route_status}); continuing." >&2
                  ;;
              *)
                  echo "Seed ${seed} route exited with status ${route_status}." >&2
                  overall_status=1
                  ;;
              esac
          done

          cp reference/sweep-metadata.txt "${artifact_dir}/metadata-${{ matrix.group }}.txt"
          printf 'status=%s\n' "${overall_status}" >> "${GITHUB_OUTPUT}"

      - name: Publish seed group status
        id: publish
        if: always()
        shell: bash
        run: |
          set -u -o pipefail

          artifact_dir="seed-artifact"
          status_file="${artifact_dir}/group-status-${{ matrix.group }}.csv"
          mkdir -p "${artifact_dir}"
          printf 'seed,timing_status,seconds,route_exit_status\n' > "${status_file}"

          for seed in ${{ matrix.seeds }}; do
              result="$(find "${artifact_dir}" -maxdepth 1 -type f -name "result-seed-${seed}.csv" -print -quit)"
              elapsed_file="${artifact_dir}/elapsed-${seed}.txt"
              exit_file="${artifact_dir}/exit-${seed}.txt"
              elapsed='NA'
              route_exit='missing'
              timing_status='NO_RESULT'
              seconds='NA'

              [[ -f "${elapsed_file}" ]] && elapsed="$(tr -d '\r\n' < "${elapsed_file}")"
              [[ -f "${exit_file}" ]] && route_exit="$(tr -d '\r\n' < "${exit_file}")"

              if [[ -n "${result}" && -f "${result}" ]]; then
                  timing_status="$(awk -F, 'NF {gsub(/\r/, "", $NF); print $NF}' "${result}" | tail -n 1)"
                  seconds="$(awk -F, 'NF {gsub(/\r/, "", $(NF-1)); print $(NF-1)}' "${result}" | tail -n 1)"
              else
                  seconds="${elapsed}"
                  case "${route_exit}" in
                  124|137)
                      timing_status='WHOLE_SEED_TIMEOUT'
                      ;;
                  0)
                      timing_status='NO_RESULT'
                      ;;
                  *)
                      timing_status='ERROR'
                      ;;
                  esac
              fi

              printf '%s,%s,%s,%s\n' \
                  "${seed}" "${timing_status}" "${seconds}" "${route_exit}" \
                  >> "${status_file}"
          done

          pass_seeds="$(awk -F, '$2 == "PASS" && $4 == "0" {if (s != "") s=s " "; s=s $1} END {print s}' "${status_file}")"
          fail_seeds="$(awk -F, '$2 == "FAIL" {if (s != "") s=s " "; s=s $1} END {print s}' "${status_file}")"
          timeout_seeds="$(awk -F, '$2 ~ /TIMEOUT/ {if (s != "") s=s " "; s=s $1} END {print s}' "${status_file}")"

          if [[ -n "${pass_seeds}" ]]; then
              printf 'any_pass=true\n' >> "${GITHUB_OUTPUT}"
              printf '\n============================================================\n'
              printf 'Timing-passing seeds: %s\n' "${pass_seeds}"
              printf '============================================================\n'
          else
              printf 'any_pass=false\n' >> "${GITHUB_OUTPUT}"
              printf 'Timing-passing seeds: none\n'
          fi

          {
              printf '### %s seeds %s\n\n' "${SWEEP_TARGET}" '${{ matrix.seeds }}'

              # Per-seed result files have no CSV header. The frozen metadata
              # defines their column order, which varies by FPGA target.
              python3 - "${artifact_dir}" "${status_file}" reference/sweep-metadata.txt <<'PY' || exit 1
          import csv
          import sys
          from pathlib import Path

          artifact_dir = Path(sys.argv[1])
          status_file = Path(sys.argv[2])
          metadata_file = Path(sys.argv[3])

          # The frozen metadata defines both the CSV columns and required clocks.
          result_columns = []
          required_clocks = {}
          for line in metadata_file.read_text(encoding="utf-8").splitlines():
              key, separator, value = line.partition("=")
              if not separator:
                  continue
              if key == "result_columns":
                  result_columns = value.split(",")
              elif key.endswith("_required_mhz"):
                  required_clocks[key.removesuffix("_required_mhz") + "_mhz"] = float(value)

          if not result_columns:
              raise SystemExit("Missing result_columns in frozen sweep metadata")

          clock_columns = [column for column in result_columns if column.endswith("_mhz")]
          required_clocks = {
              column: required_mhz
              for column, required_mhz in required_clocks.items()
              if column in clock_columns
          }
          clock_labels = {
              "clk_sys_mhz": "clk_sys",
              "litedram_user_mhz": "LiteDRAM user",
              "clk_video_mhz": "clk_video",
              "clk_tmds_mhz": "clk_tmds",
              "init_clk_mhz": "init_clk",
          }

          headers = ["Seed", "Timing"]
          headers.extend(f"{clock_labels.get(column, column)} (MHz)" for column in clock_columns)
          headers.extend(["Seconds", "Route exit"])
          print("| " + " | ".join(headers) + " |")
          print("| " + " | ".join(["---:", ":---"] + ["---:"] * len(clock_columns) + ["---:", "---:"]) + " |")

          # Keep the existing four-column group-status CSV unchanged for the watcher.
          best_seed = None
          best_ratio = -1.0
          group_has_pass = False
          with status_file.open(newline="", encoding="utf-8") as handle:
              for status in csv.DictReader(handle):
                  if status["timing_status"] == "PASS" and status["route_exit_status"] == "0":
                      group_has_pass = True
                  seed = status["seed"]
                  result_file = artifact_dir / f"result-seed-{seed}.csv"
                  measured = {}
                  if result_file.is_file():
                      with result_file.open(newline="", encoding="utf-8") as result_handle:
                          result_rows = list(csv.reader(result_handle))
                      if len(result_rows) == 1 and len(result_rows[0]) == len(result_columns):
                          measured = dict(zip(result_columns, result_rows[0]))

                  values = [seed, status["timing_status"]]
                  for column in clock_columns:
                      frequency = measured.get(column, "")
                      try:
                          values.append(f"{float(frequency):.2f}")
                      except ValueError:
                          values.append("N/A")
                  values.extend([status["seconds"], status["route_exit_status"]])
                  print("| " + " | ".join(values) + " |")

                  # Compare the weakest required clock, not just the CPU clock.
                  if status["route_exit_status"] != "0" or status["timing_status"] != "FAIL":
                      continue
                  if not required_clocks:
                      continue
                  try:
                      ratio = min(
                          float(measured[column]) / required_mhz
                          for column, required_mhz in required_clocks.items()
                      )
                  except (KeyError, ValueError, ZeroDivisionError):
                      continue
                  if ratio > best_ratio:
                      best_seed, best_ratio = seed, ratio

          if not group_has_pass:
              if best_seed is None:
                  print("\n**Best not passing:** none (no completed timing measurements).")
              else:
                  print(f"\n**Best not passing:** seed `{best_seed}` "
                        f"(weakest clock at {best_ratio:.3f}x required MHz).")
          PY

              printf '\n**Timing-passing seeds:** `%s`\n\n' "${pass_seeds:-none}"
              printf '**Failing seeds:** `%s`\n\n' "${fail_seeds:-none}"
              printf '**Timed-out seeds:** `%s`\n' "${timeout_seeds:-none}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload seed group results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecp5-sweep-seeds-${{ matrix.group }}-${{ github.run_id }}
          path: seed-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Fail incomplete route group
        if: steps.route.outputs.status != '0' || steps.publish.outputs.any_pass != 'true'
        run: |
          if [[ "${{ steps.publish.outputs.any_pass }}" != "true" ]]; then
              echo '::error::No timing-passing seeds in this route group.'
          fi
          exit 1

  summarize:
    name: Summarize ${{ inputs.target }} sweep
    needs:
      - prepare
      - route
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out summary script
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download frozen reference inputs
        uses: actions/download-artifact@v8
        with:
          name: ecp5-sweep-inputs-${{ github.run_id }}
          path: final/frozen-download

      - name: Download all seed group results
        uses: actions/download-artifact@v8
        with:
          pattern: ecp5-sweep-seeds-*-${{ github.run_id }}
          path: final/seeds
          merge-multiple: true

      - name: Expand frozen reference inputs
        shell: bash
        run: |
          mkdir -p final/frozen
          tar -xzf final/frozen-download/ecp5-sweep-inputs.tar.gz \
              -C final/frozen
          rm -rf final/frozen-download

      - name: Generate sweep summary
        id: summary
        shell: bash
        run: |
          set +e
          python3 scripts/summarize-ecp5-sweep.py \
              --target "${SWEEP_TARGET}" \
              --seed-first "${SWEEP_SEED_FIRST}" \
              --seed-last "${SWEEP_SEED_LAST}" \
              --seed-dir final/seeds \
              --metadata final/frozen/reference/sweep-metadata.txt \
              --configuration final/frozen/reference/workflow.txt \
              --output-dir final
          status=$?
          set -e
          cat final/summary.md >> "${GITHUB_STEP_SUMMARY}"
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"

      - name: Inventory final artifact
        shell: bash
        run: |
          find final -type f -print | LC_ALL=C sort > final/file-list.txt
          while IFS= read -r file; do
              sha256sum "${file}"
          done < final/file-list.txt > final/SHA256SUMS

      - name: Upload complete sweep artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecp5-seed-sweep-${{ inputs.target }}-${{ github.run_number }}-${{ github.sha }}
          path: final/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Verify sweep completeness
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.summary.outputs.status }}" != "0" ]]; then
              echo '::error::Sweep summary failed.'
              exit 1
          fi

          # The final summarizer recalculates timing closure for every required clock.
          # Check its result instead of the raw per-seed PASS/FAIL status.
          python3 - <<'PY'
          import csv

          with open("final/summary.csv", newline="", encoding="utf-8") as handle:
              passing = any(row["all_timing_pass"] == "PASS" for row in csv.DictReader(handle))

          if not passing:
              print("::error::No timing-passing seeds in the complete sweep.")
              raise SystemExit(1)
          PY
