name: ECP5 seed sweep

on:
  workflow_dispatch:
    inputs:
      target:
        description: FPGA target to sweep
        required: true
        default: ulx3s-85f
        type: choice
        options:
          - ulx3s-85f
          - ulx3s-12f
          - ulx4m-ld-85f
      seed_first:
        description: First seed to route (1-260)
        required: true
        default: "1"
        type: string
      seed_last:
        description: Last seed to route (1-260)
        required: true
        default: "260"
        type: string
      max_parallel:
        description: Maximum concurrent GitHub route jobs
        required: true
        default: "20"
        type: choice
        options:
          - "4"
          - "8"
          - "12"
          - "20"
      retain_bitstreams:
        description: Retain per-seed bitstreams in CI artifacts when produced
        required: true
        default: false
        type: boolean
      ulx3s_85f_extended_modes:
        description: ULX3S 85F extended HDMI modes (ignored for other targets)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      ulx3s_12f_memory_profile:
        description: ULX3S 12F SDRAM profile (ignored for other targets)
        required: true
        default: 32m
        type: choice
        options:
          - 32m
          - 64m
      ulx4m_sys_clk_mhz:
        description: ULX4M-LD Hazard3 system clock (ignored for other targets)
        required: true
        default: "40"
        type: choice
        options:
          - "25"
          - "40"
          - "50"
      ulx4m_litedram_cpu:
        description: ULX4M-LD LiteDRAM initialization CPU (ignored for other targets)
        required: true
        default: serv
        type: choice
        options:
          - serv
          - vexrisc
      placer:
        description: nextpnr placer
        required: true
        default: heap
        type: choice
        options:
          - heap
          - sa
      router:
        description: nextpnr router
        required: true
        default: router1
        type: choice
        options:
          - router1
          - router2
      heap_timingweight:
        description: HeAP timing weight
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "40"
      heap_critexp:
        description: HeAP criticality exponent
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
      tmg_ripup:
        description: Enable experimental timing-driven router rip-up
        required: true
        default: false
        type: boolean
      router2_alt_weights:
        description: Enable Router2 alternate weights
        required: true
        default: false
        type: boolean
      nextpnr_extra_args:
        description: Optional whitespace-separated extra nextpnr arguments
        required: false
        default: ""
        type: string
      synth_oss_cad_suite_version:
        description: OSS CAD Suite snapshot used for synthesis
        required: true
        default: "2026-07-20"
        type: string
      route_oss_cad_suite_version:
        description: OSS CAD Suite snapshot used for routing
        required: true
        default: "2026-07-20"
        type: string

permissions:
  contents: read

concurrency:
  group: ecp5-seed-sweep-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SWEEP_TARGET: ${{ inputs.target }}
  SWEEP_SEED_FIRST: ${{ inputs.seed_first }}
  SWEEP_SEED_LAST: ${{ inputs.seed_last }}
  SWEEP_MAX_PARALLEL: ${{ inputs.max_parallel }}
  RETAIN_BITSTREAMS: ${{ inputs.retain_bitstreams }}
  OSS_CAD_SUITE_VERSION: ${{ inputs.synth_oss_cad_suite_version }}
  ROUTE_OSS_CAD_SUITE_VERSION: ${{ inputs.route_oss_cad_suite_version }}
  HAZARD3_HDMI_EXTENDED_MODES: ${{ inputs.ulx3s_85f_extended_modes }}
  HAZARD3_MEMORY_PROFILE: ${{ inputs.ulx3s_12f_memory_profile }}
  HAZARD3_ULX4M_SYS_CLK_MHZ: ${{ inputs.ulx4m_sys_clk_mhz }}
  ULX4M_LITEDRAM_CPU: ${{ inputs.ulx4m_litedram_cpu }}
  SWEEP_NEXTPNR_PLACER: ${{ inputs.placer }}
  SWEEP_NEXTPNR_ROUTER: ${{ inputs.router }}
  SWEEP_NEXTPNR_HEAP_TIMINGWEIGHT: ${{ inputs.heap_timingweight }}
  SWEEP_NEXTPNR_HEAP_CRITEXP: ${{ inputs.heap_critexp }}
  SWEEP_NEXTPNR_TMG_RIPUP: ${{ inputs.tmg_ripup }}
  SWEEP_NEXTPNR_ROUTER2_ALT_WEIGHTS: ${{ inputs.router2_alt_weights }}
  SWEEP_NEXTPNR_EXTRA_ARGS: ${{ inputs.nextpnr_extra_args }}
  SWEEP_ROUTE_TIMEOUT_SECONDS: "7200"
  SWEEP_ROUTE_KILL_AFTER_SECONDS: "30"
  SWEEP_SEED_TIMEOUT_SECONDS: "7600"
  SWEEP_SEED_KILL_AFTER_SECONDS: "30"

jobs:
  prepare:
    name: Prepare frozen ${{ inputs.target }} netlist
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate sweep inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${SWEEP_SEED_FIRST}" =~ ^[0-9]+$ ||
                ! "${SWEEP_SEED_LAST}" =~ ^[0-9]+$ ||
                "${SWEEP_SEED_FIRST}" -lt 1 ||
                "${SWEEP_SEED_LAST}" -gt 260 ||
                "${SWEEP_SEED_FIRST}" -gt "${SWEEP_SEED_LAST}" ]]; then
              echo "Seed range must be within 1-260 with first <= last." >&2
              exit 1
          fi

          if [[ ! "${SWEEP_MAX_PARALLEL}" =~ ^[1-9][0-9]*$ ]]; then
              echo "max_parallel must be a positive integer." >&2
              exit 1
          fi

          chmod +x \
              scripts/sweep-ecp5.sh \
              scripts/sweep-ecp5-common.sh \
              scripts/sweep-ulx3s-85f.sh \
              scripts/sweep-ulx3s-12f.sh \
              scripts/sweep-ulx4m-ld.sh

          ./scripts/sweep-ecp5.sh --list-targets | grep -Fxq "${SWEEP_TARGET}"
          ./scripts/sweep-ecp5.sh --print-sweep-dir "${SWEEP_TARGET}"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends make

      - name: Restore synthesis OSS CAD Suite cache
        id: synth-oss-cad-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}-v1

      - name: Set up synthesis OSS CAD Suite
        if: steps.synth-oss-cad-cache.outputs.cache-hit != 'true'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}

      - name: Activate cached synthesis OSS CAD Suite
        if: steps.synth-oss-cad-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/yosys"
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5"
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/ecppack"
          printf '%s\n' "${RUNNER_TEMP}/oss-cad-suite/bin" >> "${GITHUB_PATH}"

      - name: Save synthesis OSS CAD Suite cache
        if: steps.synth-oss-cad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.OSS_CAD_SUITE_VERSION }}-v1

      - name: Initialize synthesis submodules
        shell: bash
        run: |
          git submodule sync -- third_party/Hazard3
          git submodule update --init third_party/Hazard3
          git -C third_party/Hazard3 submodule sync -- \
              scripts \
              example_soc/libfpga
          git -C third_party/Hazard3 submodule update --init -- \
              scripts \
              example_soc/libfpga

      - name: Show synthesis tool versions
        shell: bash
        run: |
          yosys --version
          nextpnr-ecp5 --version
          printf 'ecppack: %s\n' "$(command -v ecppack)"
          python3 --version

      - name: Prepare frozen target netlist
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
              scripts/sweep-ecp5.sh \
              scripts/sweep-ecp5-common.sh \
              scripts/sweep-ulx3s-85f.sh \
              scripts/sweep-ulx3s-12f.sh \
              scripts/sweep-ulx4m-ld.sh

          touch third_party/Hazard3/example_soc/soc/hazard3-boot-monitor.hex
          ./scripts/sweep-ecp5.sh --prepare "${SWEEP_TARGET}"

          sweep_dir="$(
              ./scripts/sweep-ecp5.sh --print-sweep-dir "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          netlist="$(
              ./scripts/sweep-ecp5.sh --print-netlist "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          metadata="${sweep_dir}/metadata.txt"

          printf 'Resolved sweep directory: %s\n' "${sweep_dir}"
          printf 'Resolved netlist: %s\n' "${netlist}"
          printf 'Resolved metadata: %s\n' "${metadata}"

          if [[ -z "${sweep_dir}" ]]; then
              echo '::error::Sweep directory query returned an empty value.' >&2
              exit 1
          fi
          if [[ -z "${netlist}" ]]; then
              echo '::error::Netlist query returned an empty value.' >&2
              exit 1
          fi
          if [[ ! -s "${netlist}" ]]; then
              printf '::error::Frozen netlist is missing or empty: %s\n' "${netlist}" >&2
              exit 1
          fi
          if [[ ! -s "${metadata}" ]]; then
              printf '::error::Sweep metadata is missing or empty: %s\n' "${metadata}" >&2
              find build -maxdepth 3 -name metadata.txt -print >&2 || true
              exit 1
          fi

          mkdir -p reference
          cp "${metadata}" reference/sweep-metadata.txt
          sha256sum "${netlist}" > reference/netlist.sha256

          git rev-parse HEAD > reference/hazard3-doom-head.txt
          git ls-tree HEAD third_party/Hazard3 > reference/hazard3-doom-hazard3-gitlink.txt
          git -C third_party/Hazard3 rev-parse HEAD > reference/hazard3-head.txt
          git -C third_party/Hazard3 ls-tree HEAD example_soc/libfpga \
              > reference/hazard3-libfpga-gitlink.txt
          git -C third_party/Hazard3 ls-tree HEAD scripts \
              > reference/hazard3-scripts-gitlink.txt

          {
              yosys --version
              nextpnr-ecp5 --version
              printf 'ecppack: %s\n' "$(command -v ecppack)"
          } > reference/synthesis-tool-versions.txt

          {
              printf 'target=%s\n' "${SWEEP_TARGET}"
              printf 'seed_first=%s\n' "${SWEEP_SEED_FIRST}"
              printf 'seed_last=%s\n' "${SWEEP_SEED_LAST}"
              printf 'max_parallel=%s\n' "${SWEEP_MAX_PARALLEL}"
              printf 'retain_bitstreams=%s\n' "${RETAIN_BITSTREAMS}"
              printf 'synth_oss_cad_suite_version=%s\n' "${OSS_CAD_SUITE_VERSION}"
              printf 'route_oss_cad_suite_version=%s\n' "${ROUTE_OSS_CAD_SUITE_VERSION}"
              printf 'ulx3s_85f_extended_modes=%s\n' "${HAZARD3_HDMI_EXTENDED_MODES}"
              printf 'ulx3s_12f_memory_profile=%s\n' "${HAZARD3_MEMORY_PROFILE}"
              printf 'ulx4m_sys_clk_mhz=%s\n' "${HAZARD3_ULX4M_SYS_CLK_MHZ}"
              printf 'ulx4m_litedram_cpu=%s\n' "${ULX4M_LITEDRAM_CPU}"
              printf 'placer=%s\n' "${SWEEP_NEXTPNR_PLACER}"
              printf 'router=%s\n' "${SWEEP_NEXTPNR_ROUTER}"
              printf 'heap_timingweight=%s\n' "${SWEEP_NEXTPNR_HEAP_TIMINGWEIGHT}"
              printf 'heap_critexp=%s\n' "${SWEEP_NEXTPNR_HEAP_CRITEXP}"
              printf 'tmg_ripup=%s\n' "${SWEEP_NEXTPNR_TMG_RIPUP}"
              printf 'router2_alt_weights=%s\n' "${SWEEP_NEXTPNR_ROUTER2_ALT_WEIGHTS}"
              printf 'nextpnr_extra_args=%s\n' "${SWEEP_NEXTPNR_EXTRA_ARGS}"
              printf 'route_timeout_seconds=%s\n' "${SWEEP_ROUTE_TIMEOUT_SECONDS}"
              printf 'route_kill_after_seconds=%s\n' "${SWEEP_ROUTE_KILL_AFTER_SECONDS}"
              printf 'seed_timeout_seconds=%s\n' "${SWEEP_SEED_TIMEOUT_SECONDS}"
              printf 'seed_kill_after_seconds=%s\n' "${SWEEP_SEED_KILL_AFTER_SECONDS}"
              printf 'sweep_dir=%s\n' "${sweep_dir}"
              printf 'netlist=%s\n' "${netlist}"
          } > reference/workflow.txt

      - name: Generate seed matrix
        id: matrix
        shell: bash
        run: |
          matrix="$({ python3 - <<'PY'
          import json
          import os

          seed_first = int(os.environ["SWEEP_SEED_FIRST"])
          seed_last = int(os.environ["SWEEP_SEED_LAST"])
          seeds = list(range(seed_first, seed_last + 1))
          seeds_per_job = 2
          groups = [
              seeds[index:index + seeds_per_job]
              for index in range(0, len(seeds), seeds_per_job)
          ]

          matrix = {
              "include": [
                  {
                      "group": f"{index:02d}",
                      "seeds": " ".join(str(seed) for seed in group),
                  }
                  for index, group in enumerate(groups, start=1)
              ]
          }
          print(json.dumps(matrix, separators=(",", ":")))
          PY
          } )"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Prepare route OSS CAD Suite cache
        if: env.ROUTE_OSS_CAD_SUITE_VERSION != env.OSS_CAD_SUITE_VERSION
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/oss-cad-suite"

      - name: Restore route OSS CAD Suite cache
        if: env.ROUTE_OSS_CAD_SUITE_VERSION != env.OSS_CAD_SUITE_VERSION
        id: route-oss-cad-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.ROUTE_OSS_CAD_SUITE_VERSION }}-v1

      - name: Set up route OSS CAD Suite
        if: env.ROUTE_OSS_CAD_SUITE_VERSION != env.OSS_CAD_SUITE_VERSION && steps.route-oss-cad-cache.outputs.cache-hit != 'true'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.ROUTE_OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}

      - name: Save route OSS CAD Suite cache
        if: env.ROUTE_OSS_CAD_SUITE_VERSION != env.OSS_CAD_SUITE_VERSION && steps.route-oss-cad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.ROUTE_OSS_CAD_SUITE_VERSION }}-v1

      - name: Record route nextpnr version
        shell: bash
        run: |
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5"
          "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5" --version \
              | tee reference/route-nextpnr-version.txt

      - name: Package frozen route inputs
        shell: bash
        run: |
          tar \
              --exclude='routing-sweep' \
              --exclude='*.config' \
              --exclude='*.bit' \
              --exclude='*.svf' \
              -czf "${RUNNER_TEMP}/ecp5-sweep-inputs.tar.gz" \
              reference \
              third_party/Hazard3/example_soc/synth

      - name: Upload frozen route inputs
        uses: actions/upload-artifact@v7
        with:
          name: ecp5-sweep-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/ecp5-sweep-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  route:
    name: ${{ inputs.target }} seeds ${{ matrix.seeds }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out sweep scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore route OSS CAD Suite cache
        id: route-oss-cad-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.ROUTE_OSS_CAD_SUITE_VERSION }}-v1

      - name: Activate route OSS CAD Suite
        shell: bash
        env:
          CACHE_HIT: ${{ steps.route-oss-cad-cache.outputs.cache-hit }}
        run: |
          if [[ "${CACHE_HIT}" != "true" ]]; then
              echo "Route OSS CAD Suite cache was not available." >&2
              exit 1
          fi
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-ecp5"
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/ecppack"
          printf '%s\n' "${RUNNER_TEMP}/oss-cad-suite/bin" >> "${GITHUB_PATH}"

      - name: Download frozen route inputs
        uses: actions/download-artifact@v8
        with:
          name: ecp5-sweep-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/sweep-inputs

      - name: Extract and verify frozen route inputs
        shell: bash
        run: |
          tar -xzf "${RUNNER_TEMP}/sweep-inputs/ecp5-sweep-inputs.tar.gz" \
              -C "${GITHUB_WORKSPACE}"

          chmod +x \
              scripts/sweep-ecp5.sh \
              scripts/sweep-ecp5-common.sh \
              scripts/sweep-ulx3s-85f.sh \
              scripts/sweep-ulx3s-12f.sh \
              scripts/sweep-ulx4m-ld.sh

          netlist="$(
              ./scripts/sweep-ecp5.sh --print-netlist "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          expected_sha="$(awk '{print $1}' reference/netlist.sha256)"
          actual_sha="$(sha256sum "${netlist}" | awk '{print $1}')"
          printf 'Frozen netlist SHA256: %s\n' "${actual_sha}"
          test "${actual_sha}" = "${expected_sha}"

      - name: Show route tool version
        shell: bash
        run: nextpnr-ecp5 --version

      - name: Route seed group
        id: route
        shell: bash
        run: |
          set -u -o pipefail

          sweep_dir="$(
              ./scripts/sweep-ecp5.sh --print-sweep-dir "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          netlist="$(
              ./scripts/sweep-ecp5.sh --print-netlist "${SWEEP_TARGET}" |
                  tail -n 1
          )"
          expected_sha="$(awk '{print $1}' reference/netlist.sha256)"
          artifact_dir="seed-artifact"
          overall_status=0
          mkdir -p "${artifact_dir}"

          for seed in ${{ matrix.seeds }}; do
              printf '\n============================================================\n'
              printf 'Routing %s seed %s\n' "${SWEEP_TARGET}" "${seed}"
              printf '============================================================\n'

              start_seconds="$(date +%s)"
              set +e
              SWEEP_JOBS=1 SWEEP_SKIP_SYNTH=1 \
                  timeout \
                      --signal=TERM \
                      --kill-after="${SWEEP_SEED_KILL_AFTER_SECONDS}s" \
                      "${SWEEP_SEED_TIMEOUT_SECONDS}s" \
                      ./scripts/sweep-ecp5.sh "${SWEEP_TARGET}" "${seed}" \
                  |& tee "${artifact_dir}/console-${seed}.log"
              route_status=${PIPESTATUS[0]}
              set -e
              end_seconds="$(date +%s)"

              printf '%s\n' "$((end_seconds - start_seconds))" \
                  > "${artifact_dir}/elapsed-${seed}.txt"
              printf '%s\n' "${route_status}" \
                  > "${artifact_dir}/exit-${seed}.txt"

              result="${sweep_dir}/result-seed-${seed}.csv"
              if [[ -f "${result}" ]]; then
                  cp "${result}" "${artifact_dir}/"
              fi

              shopt -s nullglob
              logs=(
                  "${sweep_dir}/pnr-${seed}.log"
                  "${sweep_dir}/seed-${seed}.log"
                  "${sweep_dir}/pnr-${seed}-failed.log"
              )
              for file in "${logs[@]}"; do
                  [[ -f "${file}" ]] && cp "${file}" "${artifact_dir}/"
              done

              if [[ "${RETAIN_BITSTREAMS}" == "true" || "${RETAIN_BITSTREAMS}" == "1" ]]; then
                  bits=("${sweep_dir}"/*-"${seed}".bit)
                  for file in "${bits[@]}"; do
                      [[ -f "${file}" ]] && cp "${file}" "${artifact_dir}/"
                  done
              fi
              shopt -u nullglob

              actual_sha="$(sha256sum "${netlist}" | awk '{print $1}')"
              printf '%s\n' "${actual_sha}" \
                  > "${artifact_dir}/netlist-sha256-${seed}.txt"

              if [[ "${actual_sha}" != "${expected_sha}" ]]; then
                  echo "Seed ${seed} changed the frozen synthesized netlist." >&2
                  overall_status=1
              fi
              case "${route_status}" in
              0)
                  ;;
              124|137)
                  echo "Seed ${seed} exceeded the whole-seed watchdog (${SWEEP_SEED_TIMEOUT_SECONDS}s, status ${route_status}); continuing." >&2
                  ;;
              *)
                  echo "Seed ${seed} route exited with status ${route_status}." >&2
                  overall_status=1
                  ;;
              esac
          done

          cp reference/sweep-metadata.txt "${artifact_dir}/metadata-${{ matrix.group }}.txt"
          printf 'status=%s\n' "${overall_status}" >> "${GITHUB_OUTPUT}"

      - name: Upload seed group results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecp5-sweep-seeds-${{ matrix.group }}-${{ github.run_id }}
          path: seed-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Fail incomplete route group
        if: steps.route.outputs.status != '0'
        run: exit 1

  summarize:
    name: Summarize ${{ inputs.target }} sweep
    needs:
      - prepare
      - route
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out summary script
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download frozen reference inputs
        uses: actions/download-artifact@v8
        with:
          name: ecp5-sweep-inputs-${{ github.run_id }}
          path: final/frozen-download

      - name: Download all seed group results
        uses: actions/download-artifact@v8
        with:
          pattern: ecp5-sweep-seeds-*-${{ github.run_id }}
          path: final/seeds
          merge-multiple: true

      - name: Expand frozen reference inputs
        shell: bash
        run: |
          mkdir -p final/frozen
          tar -xzf final/frozen-download/ecp5-sweep-inputs.tar.gz \
              -C final/frozen
          rm -rf final/frozen-download

      - name: Generate sweep summary
        id: summary
        shell: bash
        run: |
          set +e
          python3 scripts/summarize-ecp5-sweep.py \
              --target "${SWEEP_TARGET}" \
              --seed-first "${SWEEP_SEED_FIRST}" \
              --seed-last "${SWEEP_SEED_LAST}" \
              --seed-dir final/seeds \
              --metadata final/frozen/reference/sweep-metadata.txt \
              --configuration final/frozen/reference/workflow.txt \
              --output-dir final
          status=$?
          set -e
          cat final/summary.md >> "${GITHUB_STEP_SUMMARY}"
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"

      - name: Inventory final artifact
        shell: bash
        run: |
          find final -type f -print | LC_ALL=C sort > final/file-list.txt
          while IFS= read -r file; do
              sha256sum "${file}"
          done < final/file-list.txt > final/SHA256SUMS

      - name: Upload complete sweep artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecp5-seed-sweep-${{ inputs.target }}-${{ github.run_number }}-${{ github.sha }}
          path: final/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Verify sweep completeness
        if: steps.summary.outputs.status != '0'
