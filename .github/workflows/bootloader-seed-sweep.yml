name: Bootloader seed sweep

on:
  workflow_dispatch:
    inputs:
      bootloader:
        description: Bootloader implementation
        required: true
        type: choice
        options:
          - serv
          - picorv32
        default: serv
      board:
        description: Target board (currently ULX5M-GS only)
        required: true
        type: choice
        options:
          - ulx5m-gs
      start_seed:
        description: First nextpnr seed (positive integer)
        required: true
        type: number
        default: 1
      seed_count:
        description: Number of consecutive seeds (1 to 260)
        required: true
        type: number
        default: 20

permissions:
  contents: read

jobs:
  sweep:
    name: ${{ inputs.board }} / ${{ inputs.bootloader }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BOOTLOADER: ${{ inputs.bootloader }}
      BOARD: ${{ inputs.board }}
      START_SEED: ${{ inputs.start_seed }}
      SEED_COUNT: ${{ inputs.seed_count }}
    steps:
      - name: Validate input selections
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BOARD" != ulx5m-gs ]]; then
            echo 'Unsupported board' >&2
            exit 2
          fi
          if [[ "$BOOTLOADER" != serv && "$BOOTLOADER" != picorv32 ]]; then
            echo 'Unsupported bootloader' >&2
            exit 2
          fi
          if ! [[ "$START_SEED" =~ ^[0-9]+$ && "$SEED_COUNT" =~ ^[0-9]+$ ]]; then
            echo 'Seed fields must be positive integers' >&2
            exit 2
          fi
          if (( START_SEED < 1 || START_SEED > 2147483647 || SEED_COUNT < 1 || SEED_COUNT > 260 )); then
            echo 'start_seed must be 1..2147483647, seed_count 1..260' >&2
            exit 2
          fi
          if (( START_SEED + SEED_COUNT - 1 > 2147483647 )); then
            echo 'Seed range exceeds supported signed integer range' >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: YosysHQ/setup-oss-cad-suite@v4
      - name: Show tool versions
        shell: bash
        run: |
          yosys -V
          nextpnr-himbaechel --version
      - name: Prepare and run timing sweep
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BOOTLOADER" == serv ]]; then
            cd bootloader-serv
            make -f Makefile.ulx5m-gs build-ulx5m-gs/top_ulx5m_gs_flash_read-serv.json
            bash scripts/sweep-ulx5m-serv.sh "$START_SEED" "$SEED_COUNT"
          else
            cd bootloader
            make -f Makefile.ulx5m-gs build-ulx5m-gs/top_ulx5m_gs_flash_read.json
            bash scripts/sweep-ulx5m-flash-read.sh "$START_SEED" "$SEED_COUNT"
          fi
      - name: Publish sweep run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Bootloader seed sweep'
            echo
            echo "- Implementation: $BOOTLOADER"
            echo "- Board: $BOARD"
            echo "- Seeds: $START_SEED through $((START_SEED + SEED_COUNT - 1))"
            echo "- Commit: $GITHUB_SHA"
            echo
            echo 'Results and logs are retained as an artifact when generated.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs and reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootloader-sweep-${{ inputs.board }}-${{ inputs.bootloader }}-${{ github.run_id }}
          path: |
            bootloader-serv/build-ulx5m-gs/*seed-sweep*/
            bootloader/build-ulx5m-gs/*seed-sweep*/
          if-no-files-found: warn
          retention-days: 30
