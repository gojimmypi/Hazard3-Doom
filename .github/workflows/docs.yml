name: Documentation

on:
  push:
    paths:
      - ".readthedocs.yaml"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - ".readthedocs.yaml"
      - "docs/**"
      - ".github/workflows/docs.yml"

jobs:
  sphinx:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Build Croatian documentation
        env:
          READTHEDOCS_LANGUAGE: hr
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html-hr
