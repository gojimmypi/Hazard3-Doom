name: ULX5M-GS bootloader seed sweep
run-name: ULX5M bootloader ${{ inputs.target }} seeds ${{ inputs.seed_first }}-${{ inputs.seed_last }}

# Manual, hardware-free investigation. The SERV target is not the PicoRV32 probe.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Design (SERV or PicoRV32; different seeds/results)
        type: choice
        required: true
        default: flash-read-serv
        options:
          - flash-read-serv
          - usb-probe
          - flash-read-probe
      seed_first:
        description: First placement seed
        type: string
        required: true
        default: '1'
      seed_last:
        description: Last placement seed, inclusive
        type: string
        required: true
        default: '260'
      max_parallel:
        description: Maximum concurrent route jobs
        type: choice
        required: true
        default: '20'
        options: ['4', '8', '12', '20']
      seeds_per_job:
        description: Number of seeds serially routed by each job
        type: choice
        required: true
        default: '2'
        options: ['1', '2', '3', '4', '5']
      retain_bitstreams:
        description: Save every passing seed bitstream, not just each group's best
        type: boolean
        required: true
        default: false
      synth_oss_cad_suite_version:
        description: OSS CAD Suite version for synthesis
        type: string
        required: true
        default: '2026-07-20'
      route_oss_cad_suite_version:
        description: OSS CAD Suite version for routing
        type: string
        required: true
        default: '2026-07-20'
      ulx5m_heap_beta:
        description: GateMate HeAP placer beta
        type: choice
        required: true
        default: '0.6'
        options: ['0.4', '0.5', '0.6', '0.7', '0.8']
      timeout_seconds:
        description: Maximum routing time for one seed
        type: choice
        required: true
        default: '540'
        options: ['180', '300', '540', '600']
      nextpnr_extra_args:
        description: Additional nextpnr args (whitespace-separated, optional)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ulx5m-bootloader-sweep-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SWEEP_TARGET: ${{ inputs.target }}
  SWEEP_FIRST: ${{ inputs.seed_first }}
  SWEEP_LAST: ${{ inputs.seed_last }}
  SWEEP_PER_JOB: ${{ inputs.seeds_per_job }}
  SWEEP_TIMEOUT: ${{ inputs.timeout_seconds }}
  SWEEP_HEAP_BETA: ${{ inputs.ulx5m_heap_beta }}
  SWEEP_NEXTPNR_EXTRA_ARGS: ${{ inputs.nextpnr_extra_args }}
  RETAIN_BITSTREAMS: ${{ inputs.retain_bitstreams }}
  SYNTH_SUITE: ${{ inputs.synth_oss_cad_suite_version }}
  ROUTE_SUITE: ${{ inputs.route_oss_cad_suite_version }}
  XPACK_RISCV_GCC_VERSION: '15.2.0-1'
  XPACK_RISCV_GCC_LINUX_SHA256: 'aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758'

jobs:
  prepare:
    name: Prepare frozen ${{ inputs.target }} netlist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Validate inputs and scripts
        shell: bash
        run: |
          set -euo pipefail
          for version in "${SYNTH_SUITE}" "${ROUTE_SUITE}"; do
            [[ "$version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
          done
          for value in "${SWEEP_FIRST}" "${SWEEP_LAST}"; do
            [[ "$value" =~ ^[1-9][0-9]{0,8}$ ]] || exit 2
          done
          if (( SWEEP_FIRST > SWEEP_LAST || SWEEP_LAST > 2147483647 )); then
            echo 'ERROR: invalid seed range.' >&2
            exit 2
          fi
          case "${SWEEP_TARGET}" in
            flash-read-serv|usb-probe|flash-read-probe) ;;
            *) echo 'ERROR: invalid design.' >&2; exit 2 ;;
          esac
          bash -n scripts/sweep-ulx5m-bootloader.sh
          python3 -m py_compile scripts/sweep-ulx5m-bootloader-ci.py
          python3 scripts/sweep-ulx5m-bootloader-ci.py matrix \
            --first "${SWEEP_FIRST}" --last "${SWEEP_LAST}" --per-job "${SWEEP_PER_JOB}" > /dev/null

      - name: Generate parallel seed matrix
        id: matrix
        shell: bash
        run: |
          matrix="$(python3 scripts/sweep-ulx5m-bootloader-ci.py matrix \
            --first "${SWEEP_FIRST}" --last "${SWEEP_LAST}" --per-job "${SWEEP_PER_JOB}")"
          printf 'matrix=%s\n' "$matrix" >> "${GITHUB_OUTPUT}"

      - name: Restore synthesis OSS CAD Suite cache
        id: synth-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.SYNTH_SUITE }}-v1

      - name: Set up pinned synthesis OSS CAD Suite
        if: steps.synth-cache.outputs.cache-hit != 'true'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.SYNTH_SUITE }}
          github-token: ${{ github.token }}
          python-override: true

      - name: Save synthesis OSS CAD Suite cache
        if: steps.synth-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.SYNTH_SUITE }}-v1

      - name: Activate synthesis tools
        shell: bash
        run: |
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/yosys"
          printf '%s\n' "${RUNNER_TEMP}/oss-cad-suite/bin" >> "${GITHUB_PATH}"

      - name: Install pinned RISC-V compiler
        shell: bash
        run: |
          set -euo pipefail
          install_root="${GITHUB_WORKSPACE}/bin/riscv-gcc"
          archive_name="xpack-riscv-none-elf-gcc-${XPACK_RISCV_GCC_VERSION}-linux-x64.tar.gz"
          archive="${RUNNER_TEMP}/${archive_name}"
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_RISCV_GCC_VERSION}/${archive_name}"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          printf '%s  %s\n' "${XPACK_RISCV_GCC_LINUX_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${install_root}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_root}"
          "${install_root}/bin/riscv-none-elf-gcc" --version
          printf '%s\n' "${install_root}/bin" >> "${GITHUB_PATH}"

      - name: Synthesize selected bootloader exactly once
        shell: bash
        run: |
          set -euo pipefail
          case "${SWEEP_TARGET}" in
            flash-read-serv)
              source_dir=bootloader-serv
              design=top_ulx5m_gs_flash_read-serv
              constraint=top-ulx5m-gs-flash-read
              ;;
            usb-probe)
              source_dir=bootloader
              design=top_ulx5m_gs_usb_probe
              constraint=top-ulx5m-gs-usb-probe
              ;;
            flash-read-probe)
              source_dir=bootloader
              design=top_ulx5m_gs_flash_read
              constraint=top-ulx5m-gs-flash-read
              ;;
          esac
          printf 'Selected: %s (source=%s, design=%s)\n' "${SWEEP_TARGET}" "${source_dir}" "${design}"
          yosys --version
          make -C "${source_dir}" -f Makefile.ulx5m-gs "build-ulx5m-gs/${design}.json"
          mkdir -p frozen
          cp "${source_dir}/build-ulx5m-gs/${design}.json" frozen/netlist.json
          cp "${source_dir}/data/${constraint}.ccf" frozen/constraints.ccf
          cp "${source_dir}/data/${constraint}.sdc" frozen/constraints.sdc
          (
            cd frozen
            sha256sum netlist.json constraints.ccf constraints.sdc > SHA256SUMS
          )
          {
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'target=%s\n' "${SWEEP_TARGET}"
            printf 'source_dir=%s\n' "${source_dir}"
            printf 'design=%s\n' "${design}"
            printf 'synthesis_suite=%s\n' "${SYNTH_SUITE}"
            printf 'route_suite=%s\n' "${ROUTE_SUITE}"
            printf 'placer=heap\nrouter=router2\n'
            printf 'heap_beta=%s\n' "${SWEEP_HEAP_BETA}"
            printf 'nextpnr_extra_args=%s\n' "${SWEEP_NEXTPNR_EXTRA_ARGS}"
            printf 'toolchain=%s\n' "${XPACK_RISCV_GCC_VERSION}"
            yosys --version
            printf 'netlist_sha256=%s\n' "$(sha256sum frozen/netlist.json | awk '{print $1}')"
          } > frozen/metadata.txt
          cat frozen/metadata.txt
          cat frozen/SHA256SUMS

      - name: Upload frozen routing inputs
        uses: actions/upload-artifact@v7
        with:
          name: ulx5m-bootloader-frozen-${{ github.run_id }}
          path: frozen/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove synthesis install before switching toolchains
        if: env.ROUTE_SUITE != env.SYNTH_SUITE
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/oss-cad-suite"

      - name: Restore route OSS CAD Suite cache
        if: env.ROUTE_SUITE != env.SYNTH_SUITE
        id: route-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.ROUTE_SUITE }}-v1

      - name: Set up pinned route OSS CAD Suite
        if: env.ROUTE_SUITE != env.SYNTH_SUITE && steps.route-cache.outputs.cache-hit != 'true'
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.ROUTE_SUITE }}
          github-token: ${{ github.token }}

      - name: Save route OSS CAD Suite cache
        if: env.ROUTE_SUITE != env.SYNTH_SUITE && steps.route-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.ROUTE_SUITE }}-v1

  watch:
    name: LIVE timing-pass collector (${{ inputs.target }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    continue-on-error: true
    steps:
      - name: Check out watcher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Monitor completed seed groups
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SWEEP_ARTIFACT_PREFIX: ulx5m-bootloader-seeds-
          SWEEP_CLOCK_LABEL: bram_i.clk
          SWEEP_CLOCK_TARGET_MHZ: '48.00'
        run: |
          printf 'Watching bootloader design %s (bram_i.clk, 48 MHz).\n' "${SWEEP_TARGET}"
          bash scripts/watch-ecp5-sweep-results.sh \
            ulx5m-gs "${SWEEP_FIRST}" \
            "${SWEEP_LAST}" "${SWEEP_PER_JOB}"

  route:
    name: ulx5m-gs seeds ${{ matrix.group }} (${{ inputs.target }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out sweep scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore pinned route tools
        id: route-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: oss-cad-suite-${{ runner.os }}-${{ runner.arch }}-${{ env.ROUTE_SUITE }}-v1

      - name: Activate pinned nextpnr
        shell: bash
        env:
          CACHE_HIT: ${{ steps.route-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" != true ]]; then
            echo 'ERROR: route OSS CAD Suite cache missing.' >&2
            exit 1
          fi
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/nextpnr-himbaechel"
          test -x "${RUNNER_TEMP}/oss-cad-suite/bin/gmpack"
          printf '%s\n' "${RUNNER_TEMP}/oss-cad-suite/bin" >> "${GITHUB_PATH}"

      - name: Download identical frozen netlist and constraints
        uses: actions/download-artifact@v8
        with:
          name: ulx5m-bootloader-frozen-${{ github.run_id }}
          path: frozen/

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          (cd frozen && sha256sum --check SHA256SUMS)
          nextpnr-himbaechel --version
          printf 'Frozen netlist SHA256: %s\n' "$(sha256sum frozen/netlist.json | awk '{print $1}')"
          printf 'Design: %s\n' "${SWEEP_TARGET}"
          grep -Fx "target=${SWEEP_TARGET}" frozen/metadata.txt
          grep -Fx "commit=${GITHUB_SHA}" frozen/metadata.txt

      - name: Route seed group (no synthesis or hardware access)
        shell: bash
        env:
          GROUP_FIRST: ${{ matrix.first }}
          GROUP_LAST: ${{ matrix.last }}
        run: |
          set -euo pipefail
          export SWEEP_JSON="${GITHUB_WORKSPACE}/frozen/netlist.json"
          export SWEEP_CCF="${GITHUB_WORKSPACE}/frozen/constraints.ccf"
          export SWEEP_SDC="${GITHUB_WORKSPACE}/frozen/constraints.sdc"
          export SWEEP_SKIP_SYNTH=1
          export SWEEP_ALLOW_NO_PASS=1
          export OSS_CAD_SUITE_VERSION="${ROUTE_SUITE}"
          export SWEEP_OUTPUT_DIR="${GITHUB_WORKSPACE}/group-results"
          if [[ "${RETAIN_BITSTREAMS}" == true ]]; then
            export SWEEP_RETAIN_BITSTREAMS=1
          fi
          bash scripts/sweep-ulx5m-bootloader.sh \
            "${SWEEP_TARGET}" "${GROUP_FIRST}" \
            "$((GROUP_LAST - GROUP_FIRST + 1))" "${SWEEP_TIMEOUT}"

      - name: Publish group progress
        if: always()
        shell: bash
        run: |
          if [[ -s group-results/summary.md ]]; then
            cat group-results/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            printf 'No results were produced for %s seeds %s.\n' \
              "${SWEEP_TARGET}" '${{ matrix.group }}' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Prepare shared FPGA watcher results
        if: always()
        shell: bash
        env:
          GROUP_FIRST: ${{ matrix.first }}
          GROUP_LAST: ${{ matrix.last }}
        run: |
          set -euo pipefail
          mkdir -p group-results
          status_file="group-results/group-status-${{ matrix.group }}.csv"
          printf 'seed,timing_status,seconds,route_exit_status\n' > "${status_file}"
          for ((seed = GROUP_FIRST; seed <= GROUP_LAST; seed++)); do
            row=''
            if [[ -s group-results/results.tsv ]]; then
              row="$(awk -F '\t' -v seed="${seed}" \
                'NR > 1 && $1 == seed {printf "%s,%s,%s,%s", $2, $3, $5, $6; exit}' \
                group-results/results.tsv)"
            fi
            if [[ -n "${row}" ]]; then
              IFS=, read -r status fmax exit_code seconds <<< "${row}"
            else
              status=ERROR
              fmax=NA
              exit_code=missing
              seconds=NA
            fi
            printf '%s,%s,%s,%s\n' "${seed}" "${status}" "${seconds}" "${exit_code}" \
              >> "${status_file}"
            printf '%s,%s\n' "${seed}" "${fmax}" \
              > "group-results/result-seed-${seed}.csv"
          done

      - name: Upload seed-group results for shared FPGA watcher
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ulx5m-bootloader-seeds-${{ matrix.group }}-${{ github.run_id }}
          path: group-results/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  summarize:
    name: Summarize ${{ inputs.target }} sweep
    needs: [prepare, route]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out summary script
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download frozen inputs
        uses: actions/download-artifact@v8
        with:
          name: ulx5m-bootloader-frozen-${{ github.run_id }}
          path: final/frozen/

      - name: Download all seed groups
        uses: actions/download-artifact@v8
        with:
          pattern: ulx5m-bootloader-seeds-*-${{ github.run_id }}
          path: final/groups/

      - name: Verify frozen netlist and constraints
        shell: bash
        run: (cd final/frozen && sha256sum --check SHA256SUMS)

      - name: Rank passing seeds and check completeness
        id: results
        shell: bash
        run: |
          set +e
          python3 scripts/sweep-ulx5m-bootloader-ci.py summarize \
            --target "${SWEEP_TARGET}" --first "${SWEEP_FIRST}" \
            --last "${SWEEP_LAST}" --groups final/groups \
            --frozen final/frozen --out final/report
          result=$?
          set -e
          cat final/report/summary.md >> "${GITHUB_STEP_SUMMARY}"
          printf 'exit_status=%s\n' "${result}" >> "${GITHUB_OUTPUT}"

      - name: Upload complete sweep summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ulx5m-bootloader-sweep-${{ inputs.target }}-${{ github.run_number }}-${{ github.sha }}
          path: final/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Fail incomplete or zero-pass sweep
        if: steps.results.outputs.exit_status != '0'
        run: exit 1
