
name: ULX5M-GS SERV bootloader seed sweep
run-name: ULX5M full-build ${{ inputs.seed_count }} seeds from ${{ inputs.seed_first }} (${{ github.ref_name }})

# CI and WSL both call Makefile.ulx5m-gs build + qualify with the same defaults.
# Passing CI means the entire PACK-ONLY image has timing and ROM qualification;
# hardware operation is NOT implied. Advanced overrides are explicit.
on:
  workflow_dispatch:
    inputs:
      seed_first:
        description: First seed (any positive seed)
        type: string
        required: true
        default: '1'
      seed_count:
        description: Consecutive seeds to test (1..512)
        type: string
        required: true
        default: '512'
      max_parallel:
        description: Maximum concurrent route jobs
        type: choice
        required: true
        default: '20'
        options: ['4', '8', '12', '20']
      seeds_per_job:
        description: Number of seeds serially built by each job
        type: choice
        required: true
        default: '4'
        options: ['1', '2', '4', '5', '10']
      retain_bitstreams:
        description: Save every qualified seed bitstream, not just each group's best
        type: boolean
        required: true
        default: false
      synth_oss_cad_suite_version:
        description: OSS CAD Suite version for synthesis
        type: string
        required: true
        default: '2026-07-20'
      route_oss_cad_suite_version:
        description: OSS CAD Suite version for routing (must equal synthesis for full builds)
        type: string
        required: true
        default: '2026-07-20'
      ulx5m_heap_beta:
        description: GateMate HeAP placer beta (Makefile default 0.6)
        type: choice
        required: true
        default: '0.6'
        options: ['0.4', '0.5', '0.6', '0.7', '0.8']
      timeout_seconds:
        description: Maximum time for a complete build + qualify for one seed
        type: choice
        required: true
        default: '540'
        options: ['180', '300', '540', '600', '900']
      nextpnr_extra_args:
        description: Additional nextpnr args (optional; same as NEXTPNR_EXTRA_ARGS locally)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ulx5m-full-build-sweep-${{ github.ref }}
  cancel-in-progress: false

env:
  SYNTH_SUITE: ${{ inputs.synth_oss_cad_suite_version }}
  ROUTE_SUITE: ${{ inputs.route_oss_cad_suite_version }}
  SWEEP_FIRST: ${{ inputs.seed_first }}
  SWEEP_COUNT: ${{ inputs.seed_count }}
  SWEEP_PER_JOB: ${{ inputs.seeds_per_job }}
  SWEEP_TIMEOUT: ${{ inputs.timeout_seconds }}
  SWEEP_HEAP_BETA: ${{ inputs.ulx5m_heap_beta }}
  SWEEP_NEXTPNR_EXTRA_ARGS: ${{ inputs.nextpnr_extra_args }}
  RETAIN_BITSTREAMS: ${{ inputs.retain_bitstreams }}
  XPACK_VERSION: '12.2.0-1'
  XPACK_SHA256: '04b5f45d609b221505e9232b1b63ae6cdb17d0a23f13ce9c231fc4008753a58a'

jobs:
  prepare:
    name: Check shared defaults and seed matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.seeds.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate input parity and generate matrix
        id: seeds
        shell: bash
        run: |
          set -euo pipefail
          for version in "$SYNTH_SUITE" "$ROUTE_SUITE"; do
            [[ "$version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad suite: $version" >&2; exit 2; }
          done
          [[ "$SYNTH_SUITE" == "$ROUTE_SUITE" ]] || {
            echo 'Full build uses one toolchain for synthesis and routing; versions must match' >&2
            exit 2
          }
          default_suite="$(make -s -C bootloader-serv -f Makefile.ulx5m-gs show-settings | sed -n 's/^OSS_CAD_SUITE_VERSION=//p')"
          if [[ "$SYNTH_SUITE" == '2026-07-20' && "$default_suite" != "$SYNTH_SUITE" ]]; then
            echo "Workflow default differs from Makefile release: $default_suite" >&2; exit 2
          fi
          python3 -m unittest discover -s .github/scripts -p 'test_ulx5m_bootloader_sweep.py' -v
          value="$(python3 .github/scripts/ulx5m_bootloader_sweep.py matrix \
            --first "$SWEEP_FIRST" --count "$SWEEP_COUNT" --per-job "$SWEEP_PER_JOB")"
          printf 'matrix=%s\n' "$value" >> "$GITHUB_OUTPUT"
          echo "Branch: $GITHUB_REF_NAME, commit: $GITHUB_SHA"

  watch:
    name: LIVE timing-pass collector (full builds)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report fully qualified passing seeds as groups complete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -u .github/scripts/ulx5m_bootloader_sweep.py watch \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --first "$SWEEP_FIRST" --count "$SWEEP_COUNT" --per-job "$SWEEP_PER_JOB" \
            --interval 30 --max-minutes 240 --output live-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulx5m-live-timing-${{ github.run_id }}
          path: live-results/
          if-no-files-found: warn
          retention-days: 14

  route:
    name: Full build seeds ${{ matrix.group }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.ROUTE_SUITE }}
          github-token: ${{ github.token }}
          python-override: true
      - name: Install checksum-verified RISC-V compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="xpack-riscv-none-elf-gcc-${XPACK_VERSION}-linux-x64.tar.gz"
          url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_VERSION}/${archive}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "$url"
          printf '%s  %s\n' "$XPACK_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir -p bin/riscv-gcc
          tar -xzf "${RUNNER_TEMP}/${archive}" --strip-components=1 -C bin/riscv-gcc
          printf '%s\n' "${GITHUB_WORKSPACE}/bin/riscv-gcc/bin" >> "$GITHUB_PATH"
      - name: Build and qualify seeds using the identical local Makefile
        shell: bash
        env:
          GROUP_FIRST: ${{ matrix.first }}
          GROUP_LAST: ${{ matrix.last }}
        run: |
          set -euo pipefail
          yosys --version
          nextpnr-himbaechel --version
          make -s -C bootloader-serv -f Makefile.ulx5m-gs show-settings
          mkdir -p group-results
          args=(full-build --first "$GROUP_FIRST" --last "$GROUP_LAST"
                --timeout "$SWEEP_TIMEOUT" --heap-beta "$SWEEP_HEAP_BETA"
                "--extra-args=$SWEEP_NEXTPNR_EXTRA_ARGS" --output group-results)
          if [[ "$RETAIN_BITSTREAMS" == true ]]; then
            args+=(--retain-bitstreams)
          fi
          python3 .github/scripts/ulx5m_bootloader_sweep.py "${args[@]}"
      - name: Upload complete-build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulx5m-group-${{ matrix.group }}-${{ github.run_id }}
          path: group-results/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  summarize:
    name: Rank fully qualified images (not hardware-tested)
    needs: [prepare, route]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ulx5m-group-*-${{ github.run_id }}
          path: groups/
          merge-multiple: true
      - name: Aggregate qualified results, reject incomplete sweep
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ulx5m_bootloader_sweep.py summarize \
            --input groups --output summary
          {
            printf 'Ref: %s / %s\n\n' "$GITHUB_REF" "$GITHUB_SHA"
            printf 'Full-build OSS CAD Suite: %s; HeAP beta: %s\n\n' "$ROUTE_SUITE" "$SWEEP_HEAP_BETA"
            printf 'Extra nextpnr args: %s\n\n' "$SWEEP_NEXTPNR_EXTRA_ARGS"
            cat summary/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulx5m-timing-summary-${{ github.run_id }}
          path: summary/
          if-no-files-found: warn
          retention-days: 30
