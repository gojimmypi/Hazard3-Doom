name: Board integration builds

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpga-builds-${{ github.ref }}
  cancel-in-progress: false

env:
  OSS_CAD_SUITE_VERSION: "2026-07-20"
  XPACK_RISCV_GCC_VERSION: "15.2.0-1"
  XPACK_RISCV_GCC_LINUX_SHA256: "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758"

jobs:
  build:
    name: ${{ matrix.name }} complete build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      TOOLCHAIN_PREFIX: ${{ github.workspace }}/bin/riscv-gcc/bin/riscv-none-elf-
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ULX3S 85F
            board: ulx3s-85f
            command: ./scripts/build-ulx3s-doom.sh
            bitstream: build/ulx3s/fpga_ulx3s.bit
          - name: ULX4M-LD 85F
            board: ulx4m-ld-85f
            command: ./scripts/build-ulx4m-ld-doom.sh
            bitstream: build/ulx4m-ld/fpga_ulx4m_ld.bit

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache the RISC-V toolchain
        uses: actions/cache@v6
        with:
          path: bin/riscv-gcc
          key: Linux-xpack-riscv-gcc-${{ env.XPACK_RISCV_GCC_VERSION }}

      - name: Install the pinned RISC-V toolchain
        run: |
          install_root="${GITHUB_WORKSPACE}/bin/riscv-gcc"
          gcc="${install_root}/bin/riscv-none-elf-gcc"

          if [[ -d "${install_root}" && ! -x "${gcc}" ]]; then
              echo "Removing incomplete cached toolchain: ${install_root}"
              rm -rf -- "${install_root}"
          fi

          if [[ ! -x "${gcc}" ]]; then
              archive_name="xpack-riscv-none-elf-gcc-${XPACK_RISCV_GCC_VERSION}-linux-x64.tar.gz"
              archive="${RUNNER_TEMP}/${archive_name}"
              url="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_RISCV_GCC_VERSION}/${archive_name}"

              curl --fail --location --retry 3 --output "${archive}" "${url}"
              printf '%s  %s\n' "${XPACK_RISCV_GCC_LINUX_SHA256}" "${archive}" | sha256sum --check -

              mkdir -p -- "${install_root}"
              tar -xzf "${archive}" --strip-components=1 -C "${install_root}"
          fi

          "${gcc}" --version

      - name: Set up the pinned OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}
          python-override: true

      - name: Show tool versions
        run: |
          make --version
          yosys --version
          nextpnr-ecp5 --version
          printf 'ecppack: %s\n' "$(command -v ecppack)"
          "${TOOLCHAIN_PREFIX}gcc" --version
          python3 --version

      - name: Initialize required submodules
        run: ./scripts/setup-submodules.sh

      - name: Build FPGA, monitor, and Doom image
        env:
          FORCE_BITSTREAM_REBUILD: "1"
          ALLOW_TIMING_FAILURE: "1"
        run: |
          # Produce a fresh P&R result. Timing logs remain artifacts for review;
          # known timing misses do not hide synthesis, packaging, or integration failures.
          ${{ matrix.command }}

          test -s "${{ matrix.bitstream }}"
          test -s build/hazard3-test.elf
          test -s build/doom-image/hazard3-doom.h3d

      - name: Upload build artifacts and timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board }}-${{ github.sha }}
          path: |
            ${{ matrix.bitstream }}
            build/hazard3-test.elf
            build/hazard3-test.map
            build/doom-image/hazard3-doom.elf
            build/doom-image/hazard3-doom.map
            build/doom-image/hazard3-doom.h3d
            third_party/Hazard3/example_soc/synth/synth.log
            third_party/Hazard3/example_soc/synth/pnr.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
