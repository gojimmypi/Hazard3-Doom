# Probe config specific to ULX3S.

adapter driver ft232r
transport select jtag
ft232r vid_pid 0x0403 0x6015

# Note adapter_khz doesn't do anything because this is bitbanged JTAG on aux
# UART pins, but... it's mandatory

adapter speed 1000

ft232r tck_num DSR
ft232r tms_num DCD
ft232r tdi_num RI
ft232r tdo_num CTS
# trst/srst are not used but must have different values than above
ft232r trst_num RTS
ft232r srst_num DTR

# Accept the FPGA TAP IDs used by the supported ULX3S 12F and 85F boards.
# OpenOCD permits more than one -expected-id for a TAP. We are going to
# expose processor debug through a pair of custom DRs on this TAP.

set _CHIPNAME lfe5u85
jtag newtap lfe5u85 hazard3 -expected-id 0x21111043 -expected-id 0x41113043 -irlen 8 -irmask 0xFF -ircapture 0x5

# We expose the DTMCS/DMI DRs you would find on a normal RISC-V JTAG-DTM via
# the ECP5 TAP's ER1/ER2 private instructions. As long as you use the correct
# IR length for the ECP5 TAP, and use the new instructions, the ECP5 TAP
# looks a lot like a JTAG-DTM.

set _TARGETNAME $_CHIPNAME.hazard3
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Do not configure a fixed OpenOCD target work area here. This configuration
# is shared by the supported ULX3S 12F and 85F Doom targets, and the 12F uses
# only a small bootstrap SRAM before the SDRAM-resident monitor starts. The
# former 0x0001f800 work area is therefore not valid on the 12F and causes the
# RISC-V CRC helper used by GDB compare-sections to execute from unmapped RAM.
# Without a configured work area, OpenOCD falls back to direct target reads for
# checksums instead of running that target-side helper.


# OpenOCD target algorithms such as the checksum used by GDB
# compare-sections require target-side working RAM. Reserve the final 2 KiB
# of the 128 KiB internal SRAM as a temporary work area. This range can
# contain application data (for example the CoreMark stack), so preserve and
# restore its contents around each OpenOCD algorithm invocation.
#    $_TARGETNAME configure -work-area-phys 0x0001f800 \
#        -work-area-size 0x800 \
#        -work-area-backup 1

riscv set_ir dtmcs 0x32
riscv set_ir dmi 0x38

# That's it, it's a normal RISC-V processor now :)

# The OpenOCD 0.12.0 release uses the legacy underscore command. Newer
# builds use the namespaced form. Feature-detect the command instead of
# relying on the version string because development/xPack builds can report
# a 0.12-derived version while supporting the newer syntax.
if {[catch {gdb report_data_abort enable}]} {
    gdb_report_data_abort enable
}
init
