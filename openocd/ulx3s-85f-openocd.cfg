adapter driver ft232r
transport select jtag
ft232r vid_pid 0x0403 0x6015

# adapter speed is required by OpenOCD even though the ULX3S FT231X path uses
# bit-banged JTAG on the auxiliary UART signals.
adapter speed 1000

ft232r tck_num DSR
ft232r tms_num DCD
ft232r tdi_num RI
ft232r tdo_num CTS
# trst/srst are not used but must have different values than above.
ft232r trst_num RTS
ft232r srst_num DTR

# ULX3S 85F ECP5 TAP.
set _CHIPNAME lfe5u85
jtag newtap $_CHIPNAME hazard3 \
    -expected-id 0x41113043 \
    -irlen 8 \
    -irmask 0xFF \
    -ircapture 0x5

# Hazard3 exposes DTMCS/DMI through ECP5 ER1/ER2 private instructions.
set _TARGETNAME $_CHIPNAME.hazard3
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# ULX3S 85F internal SRAM layout:
#   0x00000000-0x0000ffff  monitor, traps, stack
#   0x00010000-0x0001f9ff  Doom 320x200 indexed working screen
#   0x0001fa00-0x0001ffff  reserved OpenOCD work area
#
# The final 0x600 bytes are outside the monitor/Doom working allocations and
# are large enough for the RISC-V checksum helper used by GDB compare-sections.
# Back up and restore the work area as an additional safety measure.
$_TARGETNAME configure \
    -work-area-phys 0x0001fa00 \
    -work-area-size 0x600 \
    -work-area-backup 1

riscv set_ir dtmcs 0x32
riscv set_ir dmi 0x38

# OpenOCD 0.12.0 uses the legacy underscore command. Newer builds use the
# namespaced form. Feature-detect rather than relying on the version string.
if {[catch {gdb report_data_abort enable}]} {
    gdb_report_data_abort enable
}

init
