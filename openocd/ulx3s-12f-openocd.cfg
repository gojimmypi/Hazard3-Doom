adapter driver ft232r
transport select jtag
ft232r vid_pid 0x0403 0x6015

# adapter speed is required by OpenOCD even though the ULX3S FT231X path uses
# bit-banged JTAG on the auxiliary UART signals.
adapter speed 1000

ft232r tck_num DSR
ft232r tms_num DCD
ft232r tdi_num RI
ft232r tdo_num CTS
# trst/srst are not used but must have different values than above.
ft232r trst_num RTS
ft232r srst_num DTR

# ULX3S 12F ECP5 TAP.
set _CHIPNAME lfe5u12
jtag newtap $_CHIPNAME hazard3 \
    -expected-id 0x21111043 \
    -irlen 8 \
    -irmask 0xFF \
    -ircapture 0x5

# Hazard3 exposes DTMCS/DMI through ECP5 ER1/ER2 private instructions.
set _TARGETNAME $_CHIPNAME.hazard3
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Do not configure the 85F internal-SRAM OpenOCD work area here. The ULX3S
# 12F build has only the small bootstrap SRAM at 0x00000000 before the
# SDRAM-resident monitor at 0x20000040. The 85F work area at 0x0001fa00 is
# therefore invalid on this target. With no work area, compare-sections falls
# back to direct target reads rather than executing the CRC helper from an
# invalid address. OpenOCD may print a working-memory warning for that fallback.

riscv set_ir dtmcs 0x32
riscv set_ir dmi 0x38

# OpenOCD 0.12.0 uses the legacy underscore command. Newer builds use the
# namespaced form. Feature-detect rather than relying on the version string.
if {[catch {gdb report_data_abort enable}]} {
    gdb_report_data_abort enable
}

init
